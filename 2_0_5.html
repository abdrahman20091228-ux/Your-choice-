<!--
  ================================================================
  AI EDITING PROTOCOL — إلزامي عند تعديل هذا الملف
  ================================================================
  هذا الملف له نظام إصدارات إجباري. عند قيام أي أداة أو وكيل ذكاء
  اصطناعي بتعديل أي حرف في هذا الملف، حتى لو كان التعديل صغيراً
  أو لم يطلب المستخدم تغيير الإصدار، يجب عليه قبل إنهاء التعديل:

  1) قراءة قيمة window.GAME_VERSION الحالية.
  2) زيادة رقم الإصدار مرة واحدة بالضبط.
  3) زيادة خانة PATCH (الرقم الأخير) بهذا التسلسل، وخانة PATCH لا تتجاوز 9 أبداً:
       1.2.0 → 1.2.1 → 1.2.2 → ... → 1.2.9 → 1.3.0 → 1.3.1 ...
     عند الوصول إلى 10 لا يُكتب 10 أبداً؛ يُعاد PATCH إلى 0 ويقفز الرقم الأوسط (MINOR) بمقدار واحد.
     وعند الحاجة، يُطبق نفس المنطق على MAJOR: (x.9.9 → (x+1).0.0).
     (رقم مثل 1.1.10 غير صالح — النسخة التي كُتب عليها ذلك هي 1.2.0 رسمياً.)
  4) تحديث window.GAME_VERSION فقط، وترك واجهة الإصدار تقرأ منه
     تلقائياً. لا تترك رقم الإصدار القديم في أي نص ثابت.
  5) لا تقفز أكثر من إصدار واحد لكل عملية تعديل، ولا تعيد استخدام
     نفس الرقم، ولا تغيّر الإصدار إذا لم يحدث تعديل فعلي.

  أمثلة:
    1.1.9 + تعديل واحد = 1.2.0
    1.2.0 + تعديل واحد = 1.2.1
    1.2.9 + تعديل واحد = 1.3.0

  هذه تعليمات للمحرر الذكي وليست جزءاً من منطق اللعب.
  ================================================================
-->
<script>
/* مصدر رقم الإصدار الوحيد — يجب على أي محرر ذكي تحديثه عند التعديل */
window.GAME_VERSION='2.0.5';
/* مفتاح أدوات التطوير المؤقتة (زر تحميل الخامات + رقم الإصدار العلوي).
   true = مفعّل أثناء التجربة | false = النسخة النهائية (يتجاهل كل شيء داخل علامات DEV-ONLY) */
window.DEV_MODE=true;
/* جودة الشقة: 'high' = المكيف الجديد (AC by SasiDatla) | 'medium' = المكيف القديم. تُحدَّد من زرّي المقدمة، والافتراضي عالية */
window.GAME_QUALITY='high';
</script>

<script>
/* نظام التنبيه البرمجي الهادئ */
window.onerror = function(msg, url, lineNo, columnNo, error) {
  var box = document.getElementById('debugErrorOverlay');
  if(!box){
    box = document.createElement('div');
    box.id = 'debugErrorOverlay';
    box.style.cssText = 'position:fixed;top:16px;left:16px;right:16px;max-width:540px;margin:0 auto;background:#1e1b24;color:#e8e2ee;padding:16px 18px;border-radius:14px;z-index:999999;font-family:"Tajawal",sans-serif;box-shadow:0 12px 30px rgba(0,0,0,0.5);border:1px solid #d47a96;direction:rtl;text-align:right;';
    document.body ? document.body.appendChild(box) : document.documentElement.appendChild(box);
  }
  
  box.innerHTML = 
    '<div style="font-weight:600;font-size:15px;color:#f3b4c6;margin-bottom:8px;display:flex;align-items:center;gap:6px;">' +
      '<span>📌</span> تنبيه برمجي: يلزم مراجعة سطر في الكود' +
    '</div>' +
    '<div style="background:#282330;padding:8px 12px;border-radius:8px;margin-bottom:10px;display:flex;gap:12px;align-items:center;direction:ltr;text-align:left;border:1px solid #3d3548;">' +
      '<div><span style="color:#a89fb3;font-size:13px;">السطر: </span><span style="color:#f3b4c6;font-size:15px;font-weight:700;">' + lineNo + '</span></div>' +
      '<div style="color:#786f84;font-size:12px;">| الخانة: ' + columnNo + '</div>' +
    '</div>' +
    '<div style="font-size:13px;line-height:1.6;color:#c9c2d1;margin-bottom:10px;direction:ltr;text-align:left;background:#141218;padding:8px 12px;border-radius:8px;font-family:ui-monospace,monospace;word-break:break-word;">' +
      msg +
    '</div>' +
    (error && error.stack ? '<details style="font-size:11px;color:#9b92a6;cursor:pointer;margin-bottom:10px;direction:ltr;"><summary style="color:#bfaecf;margin-bottom:4px;">عرض مسار الخطأ (Stack)</summary><pre style="white-space:pre-wrap;background:#141218;padding:8px;border-radius:6px;margin:0;">' + error.stack + '</pre></details>' : '') +
    '<button onclick="this.parentElement.remove()" style="background:#d47a96;color:#18121e;border:none;padding:6px 16px;border-radius:8px;font-weight:600;font-size:12px;cursor:pointer;font-family:inherit;">إغلاق النافذة</button>';
    
  return false;
};

window.addEventListener('unhandledrejection', function(event) {
  window.onerror('تعذر تحميل ملف: ' + (event.reason ? (event.reason.message || event.reason) : 'غير معروف'), '', 0, 0, event.reason);
});
</script>

<script>
/* تدوير فوري للوضع الأفقي (قبل تحميل three.js) لمنع ظهور الشاشة عمودية ثم قلبها بأنيميشن */
(function(){
  var w=innerWidth,h=innerHeight;
  if(w<h){
    var b=document.body;
    b.style.position='fixed'; b.style.top='0'; b.style.left='0';
    b.style.width=h+'px'; b.style.height=w+'px';
    b.style.transformOrigin='top left';
    b.style.transform='rotate(90deg) translate(0,-100%)';
  }
})();
</script>

function diffuserTexture(){
  var c=document.createElement('canvas'); c.width=c.height=256; var g=c.getContext('2d');
  g.fillStyle='#f3f3f1'; g.fillRect(0,0,256,256);
  g.strokeStyle='#c2c2c0'; g.lineWidth=3; g.strokeRect(3,3,250,250);
  var cx=128, cy=128, blades=10, rOut=116, rIn=30;
  g.save(); g.translate(cx,cy);
  for(var i=0;i<blades;i++){
    g.rotate(Math.PI*2/blades);
    g.beginPath();
    g.moveTo(-7,-rIn); g.lineTo(7,-rIn); g.lineTo(4.5,-rOut); g.lineTo(-4.5,-rOut);
    g.closePath();
    var grd=g.createLinearGradient(0,-rIn,0,-rOut);
    grd.addColorStop(0, i%2? '#e2e2df':'#eeeeec'); grd.addColorStop(1, i%2? '#c9c9c5':'#d8d8d4');
    g.fillStyle=grd; g.fill();
    g.strokeStyle='#b6b6b2'; g.lineWidth=1; g.stroke();
  }
  g.restore();
  var hub=g.createRadialGradient(cx-8,cy-8,2,cx,cy,rIn);
  hub.addColorStop(0,'#fafafa'); hub.addColorStop(1,'#c4c4c0');
  g.fillStyle=hub; g.beginPath(); g.arc(cx,cy,rIn,0,Math.PI*2); g.fill();
  g.strokeStyle='#a8a8a4'; g.lineWidth=2; g.stroke();
  var tx=new THREE.CanvasTexture(c); tx.anisotropy=4; return tx;
}

/* ========== محرك الخبز: يحسب إضاءة وظلال حقيقية (Point-light falloff + احتجاب خلف الحوائط) مرة واحدة بس على المعالج، ويخزّنها كألوان رؤوس (vertex colors) — صفر تكلفة أثناء اللعب ========== */
/* --- تقاطع شعاع (فرتكس → لمبة) مع صندوق 3D حقيقي (x,y,z) — ده اللي بيخلي الترابيزة القصيرة تحجب بس اللي تحتها --- */
function rayBox(x0,y0,z0,x1,y1,z1,o){
  var dx=x1-x0, dy=y1-y0, dz=z1-z0, tmin=0, tmax=1, t1, t2, tmp;
  if(dx===0){ if(x0<o.x1||x0>o.x2) return false; }
  else{ t1=(o.x1-x0)/dx; t2=(o.x2-x0)/dx; if(t1>t2){tmp=t1;t1=t2;t2=tmp;} if(t1>tmin)tmin=t1; if(t2<tmax)tmax=t2; if(tmin>tmax) return false; }
  if(dy===0){ if(y0<o.y0||y0>o.y1) return false; }
  else{ t1=(o.y0-y0)/dy; t2=(o.y1-y0)/dy; if(t1>t2){tmp=t1;t1=t2;t2=tmp;} if(t1>tmin)tmin=t1; if(t2<tmax)tmax=t2; if(tmin>tmax) return false; }
  if(dz===0){ if(z0<o.z1||z0>o.z2) return false; }
  else{ t1=(o.z1-z0)/dz; t2=(o.z2-z0)/dz; if(t1>t2){tmp=t1;t1=t2;t2=tmp;} if(t1>tmin)tmin=t1; if(t2<tmax)tmax=t2; if(tmin>tmax) return false; }
  return tmax>tmin+1e-6 && tmin<1-1e-6 && tmax>1e-6;
}
var LAMP_SOFT=[
  [0,0],
  [0.20,0],[-0.20,0],[0,0.20],[0,-0.20],
  [0.14,0.14],[-0.14,0.14],[0.14,-0.14],[-0.14,-0.14],
  [0.28,0.08],[-0.28,0.08],[0.28,-0.08],[-0.28,-0.08]
]; // عينات موزعة على مساحة اللمبة → تدرج أنعم للظلال، بما فيها ظلال الحوائط
function lampVis(vx,vy,vz,lp){
  var k,o,vis=0,nf=occFurn.length;
  // نفحص الحوائط والأثاث لكل عينة من مساحة اللمبة.
  // هذا يمنع الحافة الثنائية القاسية التي كانت تظهر عندما تحجب الحيطة مركز اللمبة فقط.
  for(var s=0;s<LAMP_SOFT.length;s++){
    var lx=lp.x+LAMP_SOFT[s][0], lz=lp.z+LAMP_SOFT[s][1], blocked=false;
    for(k=0;k<occWalls.length;k++){
      if(rayBox(vx,vy,vz,lx,lp.y,lz,occWalls[k])){ blocked=true; break; }
    }
    if(!blocked){
      for(k=0;k<nf;k++){
        if(rayBox(vx,vy,vz,lx,lp.y,lz,occFurn[k])){ blocked=true; break; }
      }
    }
    if(!blocked) vis++;
  }
  return vis/LAMP_SOFT.length;
}
/* --- Ambient Occlusion مخبوز: ظلال الأركان (حيطة/سقف، حيطة/أرضية، حيطة/حيطة) + ظل تلامس تحت الأثاث --- */
var AO_FLOOR_WALL=0.52, AO_CEIL_WALL=0.28, AO_WALL_FLOOR=0.52, AO_WALL_CEIL=0.28, AO_WALL_WALL=0.24, AO_FURN=0.48;
var BAKE_BASE=0.86, BAKE_DIRECT=1.18, BAKE_MAX=2.4, BAKE_AO_MIN=0.38;
function aoFall(d,r){ if(d>=r) return 0; var t=1-d/r; return t*t*(3-2*t)*0.6+t*t*0.4; } // منحنى ناعم يخف تدريجيًا
function distRect(x,z,o){ var dx=Math.max(o.x1-x,0,x-o.x2), dz=Math.max(o.z1-z,0,z-o.z2); return Math.sqrt(dx*dx+dz*dz); }
function nearestWallDist(x,y,z){
  var best=9;
  for(var k=0;k<occWalls.length;k++){ var o=occWalls[k];
    if(y<o.y0-0.02||y>o.y1+0.02) continue;
    var d=distRect(x,z,o); if(d<0.03) continue; // 0.03 = سطح الحائط نفسه، مش ركن
    if(d<best) best=d; }
  return best;
}
function structAO(vx,vy,vz,nx,ny,nz){ // ثابت (مبني على الحيطان بس) → بيتحسب مرة واحدة ويتخزّن
  var ao=1, wd=nearestWallDist(vx,vy,vz);
  if(ny>0.7){ ao*=1-AO_FLOOR_WALL*aoFall(wd,0.6); }                    // أرضية ← حيطة (ظل مطبوخ في الركن)
  else if(ny<-0.7){ ao*=1-AO_CEIL_WALL*aoFall(wd,0.5); }               // سقف ← حيطة (إضاءة خفيفة معتمة في الزاوية)
  else{
    ao*=1-AO_WALL_FLOOR*aoFall(vy,0.55);                                // حيطة ← أرضية
    ao*=1-AO_WALL_CEIL*aoFall(H-vy,0.5);                                // حيطة ← سقف
    ao*=1-AO_WALL_WALL*aoFall(wd,0.45);                                 // ركن رأسي بين حيطتين
  }
  return ao;
}
function bakeMeshLighting(mesh){
  var geo=mesh.geometry, pos=geo.attributes.position, nrm=geo.attributes.normal;
  var count=pos.count, colors=new Float32Array(count*3);
  var v=new THREE.Vector3(), n=new THREE.Vector3();
  var nm=new THREE.Matrix3().getNormalMatrix(mesh.matrixWorld);
  var sao=mesh.userData.aoStatic;
  if(!sao||sao.length!==count){ sao=mesh.userData.aoStatic=new Float32Array(count); sao.ready=false; }
  var needAO=!mesh.userData.aoDone;
  for(var i=0;i<count;i++){
    v.fromBufferAttribute(pos,i).applyMatrix4(mesh.matrixWorld);
    if(nrm){ n.fromBufferAttribute(nrm,i).applyMatrix3(nm).normalize(); } else { n.set(0,1,0); }
    if(needAO) sao[i]=structAO(v.x,v.y,v.z,n.x,n.y,n.z);
    var r=0,g=0,b=0;
    for(var j=0;j<lampWorld.length;j++){
      var lp=lampWorld[j];
      var dx=lp.x-v.x, dy=lp.y-v.y, dz=lp.z-v.z;
      var dist=Math.sqrt(dx*dx+dy*dy+dz*dz);
      if(dist<0.05||dist>lp.range) continue;
       var ndotl=(n.x*dx+n.y*dy+n.z*dz)/dist;
       if(ndotl<=0) continue; // اللمبة لا تضيء الوجه المواجه للاتجاه المعاكس؛ الإضاءة العامة تتكفل بالملء
      var vis=lampVis(v.x,v.y,v.z,lp); // 0..1 — حجب حقيقي بالارتفاع (الحيطان كاملة الطول، الأثاث بارتفاعه الفعلي)
      if(vis<=0) continue;
      var atten=1-dist/lp.range; atten*=atten;
      var contrib=atten*ndotl*lp.strength*vis;
      r+=contrib*lp.r; g+=contrib*lp.g; b+=contrib*lp.b;
    }
    var ao=sao[i];
    if(n.y>0.7&&v.y<0.15&&occFurn.length){ // ظل تلامس ناعم حوالين/تحت الأثاث على الأرضية
      for(var k=0;k<occFurn.length;k++){ var d=distRect(v.x,v.z,occFurn[k]); if(d<0.35) ao*=1-AO_FURN*aoFall(d,0.35); }
    }
     ao=Math.max(BAKE_AO_MIN,ao);
     colors[i*3]=(Math.min(BAKE_MAX,r*BAKE_DIRECT)+BAKE_BASE)*ao;
     colors[i*3+1]=(Math.min(BAKE_MAX,g*BAKE_DIRECT)+BAKE_BASE)*ao;
     colors[i*3+2]=(Math.min(BAKE_MAX,b*BAKE_DIRECT)+BAKE_BASE)*ao;
  }
  mesh.userData.aoDone=true;
  geo.setAttribute('color', new THREE.BufferAttribute(colors,3));
}
function bakeLightingNow(){
  scene.updateMatrixWorld(true);
  bakeMeshes.forEach(bakeMeshLighting);
}

function prepareFurnitureModel(root){
  root.traverse(function(o){
    if(o.isMesh){
      o.frustumCulled=true;
      if(o.material) o.material.vertexColors=true;
      bakeMeshes.push(o);
    }
  });
}

/* تحويل كل خامات موديل إلى أبيض (يُبقي الأجزاء الزجاجية الشفافة كما هي) */
function paintFurnitureWhite(root){
  root.traverse(function(o){
    if(!o.isMesh || !o.material) return;
    var mats=Array.isArray(o.material)?o.material:[o.material];
    mats.forEach(function(m){
      if(m.transparent && m.opacity<0.95) return;
      m.map=null; m.metalnessMap=null; m.roughnessMap=null;
      if(m.color) m.color.setHex(0xffffff);
      m.metalness=0; m.roughness=0.5;
      m.needsUpdate=true;
    });
  });
}

function centerAndPlaceOnBase(root, x, z, baseY, targetWidth, rotationY){
  root.rotation.y=rotationY||0;
  scene.updateMatrixWorld(true);

  var box=new THREE.Box3().setFromObject(root);
  var size=box.getSize(new THREE.Vector3());
  if(size.x>0.0001 && targetWidth){
    var s=targetWidth/size.x;
    root.scale.multiplyScalar(s);
    scene.updateMatrixWorld(true);
    box.setFromObject(root);
  }

  var center=box.getCenter(new THREE.Vector3());
  var minY=box.min.y;

  root.position.x += x-center.x;
  root.position.z += z-center.z;
  root.position.y += baseY-minY;
}

/* مثل الدالة اللي فوق بالظبط، بس بدل ما نحط قاعدة الموديل على الأرضية (baseY)،
   بنثبّت مركز الموديل على ارتفاع محدد (centerY) — عشان المكيف يتعلق قرب السقف مش الأرض */
function centerAndPlaceAtHeight(root, x, z, centerY, targetWidth, rotationY){
  root.rotation.y=rotationY||0;
  scene.updateMatrixWorld(true);

  var box=new THREE.Box3().setFromObject(root);
  var size=box.getSize(new THREE.Vector3());
  if(size.x>0.0001 && targetWidth){
    var s=targetWidth/size.x;
    root.scale.multiplyScalar(s);
    scene.updateMatrixWorld(true);
    box.setFromObject(root);
  }

  var center=box.getCenter(new THREE.Vector3());
  root.position.x += x-center.x;
  root.position.z += z-center.z;
  root.position.y += centerY-center.y;
}

/* يقيس زاوية الميل الكامنة داخل ملف الموديل نفسه */
function footprintYaw(root){
  var n=0,cx=0,cz=0,sxx=0,szz=0,sxz=0,v=new THREE.Vector3();
  root.updateMatrixWorld(true);
  function scan(fn){
    root.traverse(function(o){
      if(!o.isMesh||!o.geometry||!o.geometry.attributes.position) return;
      var pa=o.geometry.attributes.position;
      for(var i=0;i<pa.count;i++){ v.fromBufferAttribute(pa,i).applyMatrix4(o.matrixWorld); fn(v); }
    });
  }
  scan(function(p){ cx+=p.x; cz+=p.z; n++; });
  if(n<3) return 0;
  cx/=n; cz/=n;
  scan(function(p){ var x=p.x-cx,z=p.z-cz; sxx+=x*x; szz+=z*z; sxz+=x*z; });
  var a=0.5*Math.atan2(2*sxz, sxx-szz);
  var q=Math.round(a/(Math.PI/2))*(Math.PI/2);
  if(Math.abs(a-q)<8*Math.PI/180) a=q;
  return a;
}
/* يحدد جهة ظهر المطبخ (الجهة اللي فيها دولاب الحائط المرتفع) */
function backSideSign(root){
  var box=new THREE.Box3().setFromObject(root);
  var midZ=(box.min.z+box.max.z)/2, yMin=0, yMax=0, v=new THREE.Vector3();
  root.traverse(function(o){
    if(!o.isMesh||!o.geometry||!o.geometry.attributes.position) return;
    var pa=o.geometry.attributes.position;
    for(var i=0;i<pa.count;i++){
      v.fromBufferAttribute(pa,i).applyMatrix4(o.matrixWorld);
      if(v.z<midZ){ if(v.y>yMin) yMin=v.y; } else { if(v.y>yMax) yMax=v.y; }
    }
  });
  return yMin>=yMax ? -1 : 1;
}

function restyleTV(root){
  root.updateMatrixWorld(true);
  var tb=new THREE.Box3().setFromObject(root), ts=tb.getSize(new THREE.Vector3());
  var screenRe=/screen|display|lcd|led|monitor|glass|panel|شاشة/i, best=null, bestScore=0, list=[];
  root.traverse(function(o){ if(o.isMesh&&o.material) list.push(o); });
  list.forEach(function(o){
    var mats=Array.isArray(o.material)?o.material:[o.material];
    var nm=(o.name||'')+' '+mats.map(function(m){return (m&&m.name)||'';}).join(' ');
    var mb=new THREE.Box3().setFromObject(o), ms=mb.getSize(new THREE.Vector3());
    var area=(ms.x/Math.max(ts.x,1e-4))*(ms.y/Math.max(ts.y,1e-4)), score=0;
    if(screenRe.test(nm)) score=10+area;
    else if(area>0.35&&area<0.92&&mats.length===1) score=area;
    if(score>bestScore){ bestScore=score; best=o; }

  function screenMat(){ return new THREE.MeshStandardMaterial({color:0x1d1e22,roughness:0.3,metalness:0.1,vertexColors:true}); }
  list.forEach(function(o){
    var isArr=Array.isArray(o.material), mats=isArr?o.material:[o.material];
    var out=mats.map(function(m){
      var byName=screenRe.test((m&&m.name)||'');
      return (byName||(o===best&&mats.length===1))?screenMat():bodyMat();

    if(ms.x>0.3*ts.x && ms.y>0.25*ts.y){
      var k=pick.byName?0:0.035, kb=pick.byName?0:0.06;
      return {x1:mb.min.x+ms.x*k, x2:mb.max.x-ms.x*k, y1:mb.min.y+ms.y*kb, y2:mb.max.y-ms.y*k, z:mb.max.z, how:'mesh'};

  tv.updateMatrixWorld(true);

      if(v.x<g.x1)g.x1=v.x; if(v.x>g.x2)g.x2=v.x; if(v.y<g.y1)g.y1=v.y; if(v.y>g.y2)g.y2=v.y; any=true;
    }

    var bestG=null, bestA=0;
    Object.keys(groups).forEach(function(kk){ var g=groups[kk], a=(g.x2-g.x1)*(g.y2-g.y1); if(a>bestA){ bestA=a; bestG=g; } });

}

function addFurniture(){
  function afterLoaderReady(){
    var loader=new THREE.GLTFLoader();
    var loaded=0, total=5;

    function finishedOne(){
      loaded++;
      if(loaded===total){
        scene.updateMatrixWorld(true);
        bakeLighting();
      }
    }

    /* الطاولة: نرجعها للخلف للحائط المقابل للصالة (الجدار الشمالي) بدل الحائط عند الأريكة */
    var TABLE_X=14.45, TABLE_Z=4.71; // رجوع 3 سم للخلف عن الموضع السابق
    loader.load(TABLE_GLB_URL, function(gltf){
      var table=gltf.scene;
      table.position.set(TABLE_X,0,TABLE_Z);
      prepareFurnitureModel(table);
      paintFurnitureWhite(table); // طاولة التلفزيون بيضاء
      scene.add(table);

      /* تصادم قريب من جسم الطاولة بعد إرجاعها للخلف للحائط المقابل */
      pushRect(TABLE_X-0.75,TABLE_Z-0.39,TABLE_X+0.75,TABLE_Z+0.39,0.45);
      finishedOne();
    }, undefined, function(err){
      console.warn('تعذر تحميل موديل الطاولة',err);
      finishedOne();
    });

    /* التلفاز: على الثلث الأخير من سطح الطاولة، ناحية الحائط */
    loader.load(TV_GLB_URL, function(gltf){
      var tv=gltf.scene;
      prepareFurnitureModel(tv);
      var tvPick=restyleTV(tv);
      scene.add(tv);
      centerAndPlaceOnBase(tv,TABLE_X,4.52,0.48,1.62,0); // يتحرك 3 سم مع الترابيزة
      scene.updateMatrixWorld(true); refSet('tv',new THREE.Box3().setFromObject(tv));   // مرجع لمكان ساعة فوق التلفاز
      try{ tvBuildScreen(tv,tvPick); }catch(e){ console.warn('تعذر بناء شاشة التلفاز',e); }
      finishedOne();
    }, undefined, function(err){
      console.warn('تعذر تحميل موديل التلفاز',err);
      finishedOne();
    });

    /* الريموت: يتحط على ترابيزة القهوة قدام الأريكة (مش ترابيزة التلفزيون) */
    loader.load(REMOTE_GLB_URL, function(gltf){

      onSofaTableTop(function(topY){

    loader.load(KITCHEN_GLB_URL, function(gltf){

      scene.add(kitchen);

      var KITCHEN_CENTER_X=3.87;
      var KITCHEN_FAR_WALL_Z=4.18;
      var KITCHEN_BASE_MAX_X=7.05, KITCHEN_BASE_MAX_Z=2.02;
      var KITCHEN_GROWTH=1.15;
      var KITCHEN_PUSH_Z=-0.85;  // كان -0.9 — اتبعد 5 سم عن الجدار. تحريك المجسم على محور Z: سالب = ناحية الحيطة البعيدة
var KITCHEN_PUSH_X=0;      // تحريك المجسم على محور X: موجب = يمين، سالب = شمال

      /* (أ) تصحيح الميل الكامن في ملف الموديل — المحور الطويل يبقى مستقيم على X */
      kitchen.rotation.y=0; kitchen.scale.set(1,1,1); kitchen.position.set(0,0,0);
      scene.updateMatrixWorld(true);
      kitchen.rotation.y=footprintYaw(kitchen);
      scene.updateMatrixWorld(true);

      /* (ب) نفس معادلة التكبير السابقة حرفيًا (140%) */
      var kitchenBox=new THREE.Box3().setFromObject(kitchen);
      var kitchenSize=kitchenBox.getSize(new THREE.Vector3());
      var kitchenScale=Math.min(
        KITCHEN_BASE_MAX_X/Math.max(kitchenSize.x,0.0001),
        KITCHEN_BASE_MAX_Z/Math.max(kitchenSize.z,0.0001)
      ) * KITCHEN_GROWTH;
      kitchen.scale.multiplyScalar(kitchenScale);
      scene.updateMatrixWorld(true);

      /* (ج) لو ظهر المطبخ في الجهة المقابلة نقلبه 180° */
      if(true){
        kitchen.rotation.y+=Math.PI;
        scene.updateMatrixWorld(true);
      }

      /* (د) توسيط الطول + إلصاق الظهر بالجدار البعيد + إنزال القاعدة للأرض */
      kitchenBox.setFromObject(kitchen);
      var kc=kitchenBox.getCenter(new THREE.Vector3());
      kitchen.position.x += KITCHEN_CENTER_X-kc.x;
      kitchen.position.z += KITCHEN_FAR_WALL_Z-kitchenBox.min.z;
      scene.updateMatrixWorld(true);
      kitchenBox.setFromObject(kitchen);
      kitchen.position.y += 0.01-kitchenBox.min.y;
            /* (هـ) تحريك يدوي للمجسم المرئي فقط — التصادم مبيتأثرش */
      kitchen.position.z += KITCHEN_PUSH_Z;
      kitchen.position.x += KITCHEN_PUSH_X;
      scene.updateMatrixWorld(true);

      /* تصادم مضغوط — تتحكم فيه من السطرين اللي تحت */
      var KITCHEN_COLLISION_DEPTH=0.55;      // عمق التصادم من الجدار (بالمتر)
      var KITCHEN_COLLISION_TRIM_SIDES=0.35; // المسافة المبتورة من الطرفين يمين ويسار
      scene.updateMatrixWorld(true);
      kitchenBox.setFromObject(kitchen);
      pushRect(
        kitchenBox.min.x+KITCHEN_COLLISION_TRIM_SIDES, KITCHEN_FAR_WALL_Z,
        kitchenBox.max.x-KITCHEN_COLLISION_TRIM_SIDES, KITCHEN_FAR_WALL_Z+KITCHEN_COLLISION_DEPTH,
        kitchenBox.max.y
      );
      finishedOne();
    }, undefined, function(err){
      console.warn('تعذر تحميل موديل المطبخ الجديد',err);
      finishedOne();
    });

    /* السرير: غرفة 1، وهي الغرفة التي تشترك في جدارها السفلي مع المطبخ */
    loader.load(BED_GLB_URL, function(gltf){
      var bed=gltf.scene;
      prepareFurnitureModel(bed);
      scene.add(bed);

      /* السرير مكبّر 1.2× ومركّب في ركن غرفة 1:
         - عند الدخول من الباب (وأنت متجه غرباً) ترى ذيل السرير، ومقدمته (الرأس/الظهر) ملاصقة للحائط الغربي المقابل.
         - جانبه الأيمن (من وجهة نظر الداخل) ملاصق للحائط الشمالي.
         - فاصل 1 سم بين السرير وكل حائط. */
      var BED_SCALE=1.2, BED_WALL_GAP=0.01;
      var BED_RIGHT_WALL='north';                // 'north' = الحائط على يمين الداخل | 'south' = الحائط المشترك مع المطبخ
      var ROOM1_WEST_FACE=0.2, ROOM1_NORTH_FACE=0.2, ROOM1_SOUTH_FACE=4.04; // الأوجه الداخلية لحوائط غرفة 1

      bed.scale.multiplyScalar(BED_SCALE);

      /* اختيار الدوران: الطول على محور x (غرب-شرق) ورأس السرير (الطرف الأعلى/الظهر) ناحية الغرب */
      var bestRot=null;
      [0,Math.PI/2,Math.PI,-Math.PI/2].forEach(function(rot){
        bed.rotation.y=rot; scene.updateMatrixWorld(true);
        var bx=new THREE.Box3().setFromObject(bed), sz=bx.getSize(new THREE.Vector3());
        var longX=sz.x>=sz.z, lo=bx.min.x+sz.x*0.2, hi=bx.max.x-sz.x*0.2, yW=0, yE=0, v=new THREE.Vector3();
        bed.traverse(function(o){
          if(!o.isMesh||!o.geometry||!o.geometry.attributes.position) return;
          var pa=o.geometry.attributes.position;
          for(var i=0;i<pa.count;i++){
            v.fromBufferAttribute(pa,i).applyMatrix4(o.matrixWorld);
            if(v.x<=lo){ if(v.y>yW) yW=v.y; } else if(v.x>=hi){ if(v.y>yE) yE=v.y; }
          }
        });
        var score=yW-yE; // موجب = الطرف الغربي أعلى (لوح الرأس)
        if(!bestRot || (longX&&!bestRot.longX) || (longX===bestRot.longX && score>bestRot.score+0.01)) bestRot={rot:rot,score:score,longX:longX};
      });
      bed.rotation.y=bestRot.rot;
      scene.updateMatrixWorld(true);

      var bb=new THREE.Box3().setFromObject(bed);
      bed.position.x += (ROOM1_WEST_FACE+BED_WALL_GAP)-bb.min.x;
      bed.position.y += 0.02-bb.min.y;
      if(BED_RIGHT_WALL==='north') bed.position.z += (ROOM1_NORTH_FACE+BED_WALL_GAP)-bb.min.z;
      else bed.position.z += (ROOM1_SOUTH_FACE-BED_WALL_GAP)-bb.max.z;

      /* تصادم مطابق للسرير بعد وضعه */
      scene.updateMatrixWorld(true);
      var bedBox=new THREE.Box3().setFromObject(bed);
      pushRect(bedBox.min.x,bedBox.min.z,bedBox.max.x,bedBox.max.z,bedBox.max.y);
      refSet('bed',bedBox.clone());   // مرجع لمكان ساعة مقابلة للسرير
      try{   // ارتفاع سطح المخدّة/المرتبة عند مكان الرأس (ناحية الحائط الغربي)
        var _hx=bedBox.min.x+0.55, _hz=(bedBox.min.z+bedBox.max.z)/2;
        var _rc=new THREE.Raycaster(new THREE.Vector3(_hx,bedBox.max.y+1,_hz),new THREE.Vector3(0,-1,0),0,bedBox.max.y+3);
        var _hit=_rc.intersectObject(bed,true);
        bedInfo={box:bedBox.clone(),hx:_hx,hz:_hz,topY:_hit.length?_hit[0].point.y:bedBox.min.y+0.6};
      }catch(err){ bedInfo={box:bedBox.clone(),hx:bedBox.min.x+0.55,hz:(bedBox.min.z+bedBox.max.z)/2,topY:bedBox.min.y+0.6}; }
      finishedOne();
    }, undefined, function(err){
      console.warn('تعذر تحميل موديل السرير',err);
      finishedOne();
    });
  }

  if(window.THREE && THREE.GLTFLoader){ afterLoaderReady(); }
  else{
    var s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js';
    s.onload=afterLoaderReady;
    s.onerror=function(){ console.warn('تعذر تحميل GLTFLoader'); };
    document.head.appendChild(s);
  }
}

/* ========== تكييف: 3 وحدات جدارية علوية (غرفة1 + غرفة2 + الصالة) ==========
   موديل واحد يتحمّل مرة، وبعدين يتنسخ 3 مرات (نفس أسلوب مفاتيح الإضاءة تحت). */
/* نقطة تجميع: أسفل مكيف الصالة (الفعلي بعد التحميل) + مركزه على x — لوحة الحائط بتتحط تحته */
var livingACInfo=null, livingACWaiters=[];
function setLivingAC(bottomY,centerX){ livingACInfo={bottom:bottomY,x:centerX}; livingACWaiters.splice(0).forEach(function(f){ f(livingACInfo); }); }
function onLivingAC(cb){ if(livingACInfo) cb(livingACInfo); else livingACWaiters.push(cb); }

function addACUnits(){
  function afterLoaderReady(){
    var loader=new THREE.GLTFLoader();
    /* الجدار الشمالي الخارجي لغرفة1 وغرفة2 عند z=0.1 (سمك T)، وجه الغرفة الداخلي تقريباً z=0.22.
       الجدار الجنوبي الخارجي للصالة عند z=8.9، وجهها الداخلي تقريباً z=8.78.
       تم إنزال المكيفات قليلاً عن موضعها السابق لتفادي اصطدام الحجم الجديد بالسقف.
       الحجم النهائي = 210% من الحجم الحالي، مع الحفاظ على تناسب أبعاد الموديل. */
    var acSpecs=[
      {name:'غرفة 1', x:3.92,  z:0.24, y:2.35, rot:0, wall:0.20},
      {name:'غرفة 2', x:14.23, z:0.24, y:2.35, rot:0, wall:0.20},
      {name:'الصالة', x:12.5,  z:4.18, y:2.35, rot:0, wall:4.16}
    ];
    var HQ=(window.GAME_QUALITY==='high');   // عالية = المكيف الجديد | متوسطة = المكيف القديم
    var AC_PREVIOUS_WIDTH=0.85;
    var AC_SCALE=2.10*1.05;   // +5% فوق الحجم الحالي
    var AC_OLD_WIDTH=AC_PREVIOUS_WIDTH*AC_SCALE;          // عرض المكيف القديم
    var AC_TARGET_WIDTH=HQ ? AC_OLD_WIDTH*0.85 : AC_OLD_WIDTH;   // الجديد = 85% من حجم القديم
    loader.load(HQ?AC_HQ_GLB_URL:AC_GLB_URL, function(gltf){
      /* المكيف أبيض في الجودتين.
         القديم: نُبقي الأجزاء الغامقة جداً (فتحات/شاشة).
         الجديد (عالية): نستبدل كل الخامات المعتمة بخامة قياسية بيضاء جديدة — عشان خامات Sketchfab (specular-glossiness / ألوان vertex / emissive)
         كانت بتفضل تطلع سودا حتى بعد تغيير اللون. الزجاج الشفاف يفضل زي ما هو. */
      gltf.scene.traverse(function(o){
        if(!o.isMesh||!o.material) return;
        if(HQ){
          var isArrH=Array.isArray(o.material), listH=isArrH?o.material:[o.material];
          var outH=listH.map(function(m){
            if(m&&m.transparent&&m.opacity<0.95) return m;
            return new THREE.MeshStandardMaterial({color:0xbdbdbd,emissive:0x0b0b0b,roughness:0.5,metalness:0,side:(m&&m.side)||THREE.FrontSide,vertexColors:true});   // أقل بياضًا (كان e6e6e6/181818)
          });
          o.material=isArrH?outH:outH[0];
          return;
        }
        (Array.isArray(o.material)?o.material:[o.material]).forEach(function(m){
          if(m.transparent&&m.opacity<0.95) return;
          if(m.color){ var hs={}; m.color.getHSL(hs); if(hs.l<0.12) return; }
          m.map=null; m.metalnessMap=null; m.roughnessMap=null;
          if(m.color) m.color.setHex(0xe6e6e6);
          m.metalness=0; m.roughness=0.45; m.needsUpdate=true;
        });
      });
      /* الموديل الجديد: نضمن إن الطول الأكبر على محور x (يتوازى مع الحيطة) */
      var hqYaw=0;
      if(HQ){
        var mb0=new THREE.Box3().setFromObject(gltf.scene), ms0=mb0.getSize(new THREE.Vector3());
        if(ms0.z>ms0.x*1.2) hqYaw=Math.PI/2;
      }
      acSpecs.forEach(function(spec){
        var ac=gltf.scene.clone(true);
        prepareFurnitureModel(ac);
        var holder=ac;
        if(HQ){ ac.rotation.y=hqYaw; holder=new THREE.Group(); holder.add(ac); }
        scene.add(holder);
        centerAndPlaceAtHeight(holder, spec.x, spec.z, spec.y, AC_TARGET_WIDTH, spec.rot);
        if(HQ){   // ظهره ملزوق في الحيطة، وأعلاه ما يلمسش السقف
          scene.updateMatrixWorld(true);
          var hb=new THREE.Box3().setFromObject(holder);
          holder.position.z += (spec.wall+0.01)-hb.min.z;
          if(hb.max.y>H-0.03) holder.position.y -= hb.max.y-(H-0.03);
          scene.updateMatrixWorld(true);
        }
        if(spec===acSpecs[2]){
          scene.updateMatrixWorld(true);
          var acb=new THREE.Box3().setFromObject(holder);
          setLivingAC(acb.min.y,(acb.min.x+acb.max.x)/2);
        }
      });
      scene.updateMatrixWorld(true);
      bakeLighting();
    }, undefined, function(err){
      console.warn('تعذر تحميل موديل المكيف',err);
      setLivingAC(2.05,12.5);
    });
  }
  if(window.THREE && THREE.GLTFLoader){ afterLoaderReady(); }
  else{
    var s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js';
    s.onload=afterLoaderReady;
    s.onerror=function(){ console.warn('تعذر تحميل GLTFLoader للمكيف'); };
    document.head.appendChild(s);
  }
}

/* ========== أريكة الصالة: مقابل التلفاز، الاتجاه معكوس، وظهرها ملاصق للجدار المقابل ========== */
function addSalonSofa(){
  function afterLoaderReady(){
    var loader=new THREE.GLTFLoader();

    loader.load(SOFA_GLB_URL,function(gltf){
      var sofa=gltf.scene;
      prepareFurnitureModel(sofa);
      scene.add(sofa);

      /*
        التلفاز مركزه تقريباً عند x=14.45, z=4.84.
        الجدار المقابل في الصالة هو الجدار الجنوبي عند z=8.9،
        ووجهه الداخلي عند z=8.78 تقريباً.
        نُبقي الأريكة بطول مناسب للصالة (3.6م تقريباً)،
        ونضعها في منتصف التلفاز أفقياً، ثم نثبت ظهرها فعلياً
        على سطح الجدار بدل الاعتماد على تخمين نقطة الأصل للموديل.
      */
      var SOFA_TARGET_WIDTH=2.43; // 90% من الحجم الحالي 2.70م
      var SOFA_WALL_Z=8.78;
      var SOFA_X=14.45; // نفس محور التلفاز أفقيًا، وبعد التصغير يعاد ضبط المركز تلقائيًا

      sofa.rotation.y=Math.PI; // عكس الاتجاه: الواجهة الآن تتجه نحو +Z
      scene.updateMatrixWorld(true);

      var box=new THREE.Box3().setFromObject(sofa);
      var size=box.getSize(new THREE.Vector3());
      if(size.x>0.0001){
        sofa.scale.multiplyScalar(SOFA_TARGET_WIDTH/size.x);
        scene.updateMatrixWorld(true);
        box.setFromObject(sofa);
      }

      /* بعد عكس الاتجاه والتصغير، نعيد حساب الـBox3 ثم نوسّطها على التلفاز ونلصق الحافة الخلفية بالجدار. */
      var center=box.getCenter(new THREE.Vector3());
      sofa.position.x += SOFA_X-center.x;
      sofa.position.z += SOFA_WALL_Z-box.max.z;

      /* وضع قاعدة الأريكة على الأرض بدقة. */
      scene.updateMatrixWorld(true);
      box.setFromObject(sofa);
      sofa.position.y += -box.min.y;

      /* تصادم مطابق للمجسم بعد وضعه، مع هامش بسيط. */
      scene.updateMatrixWorld(true);
      box.setFromObject(sofa);
      var sofaMarginX = 0.12;
var sofaMarginZ = 0.15;
pushRect(box.min.x + sofaMarginX, box.min.z, box.max.x - sofaMarginX, box.max.z - sofaMarginZ, box.max.y); 

      scene.updateMatrixWorld(true);
      bakeLighting();
    },undefined,function(err){
      console.warn('تعذر تحميل موديل أريكة الصالة',err);
    });
  }

  if(window.THREE && THREE.GLTFLoader){
    afterLoaderReady();
  }else{
    var s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js';
    s.onload=afterLoaderReady;
    s.onerror=function(){ console.warn('تعذر تحميل GLTFLoader للأريكة'); };
    document.head.appendChild(s);
  }
}
addSalonSofa();

/* ========== مفاتيح إضاءة شكلية فقط: تحميل موديل الـGLB مرة واحدة ثم نسخه في 6 أماكن ========== */
function addLightSwitches(){
  function afterLoaderReady(){
    var loader=new THREE.GLTFLoader();

    /*
      كل عنصر يحدد سطح الحائط الذي يثبت عليه السويتش.
      side يحدد جهة الغرفة بالنسبة لمحور الحائط.
      inset = 0 عمدًا: السويتش لا يدخل داخل الحائط، بل يلامس سطحه فقط.
    */
    var positions=[
      {name:'غرفة 1',    x:7.744, z:1.90, wall:'x', side:-1, rot: Math.PI/2},   // أُبعد عن الباب (كان z=2.72 ورا الضلفة)
      {name:'غرفة 2',    x:10.984,z:1.90, wall:'x', side: 1, rot:-Math.PI/2},   // أُبعد عن الباب (كان z=2.72 ورا الضلفة)
      {name:'المطبخ',   x:7.10,  z:6.56, wall:'z', side:-1, rot:0},            // أُبعد عن الباب (كان x=5.08 ورا الضلفة)
      {name:'الصالة',   x:17.48, z:7.42, wall:'x', side:-1, rot: Math.PI/2},
      {name:'الممر',    x:0.10,  z:7.18, wall:'x', side: 1, rot:-Math.PI/2},
      {name:'خارج الحمام',x:10.30,z:3.06, wall:'z', side:1, rot:Math.PI}
    ];

    /* الحجم في النسخة السابقة كان 60% من الحجم الأساسي.
       المطلوب الآن = ضعف الحجم الحالي بالضبط = 120% من الحجم الأساسي. */
    var BASE_TARGET_HEIGHT=0.138;
    var BASE_TARGET_PLAN=0.078;
    var PREVIOUS_SWITCH_SCALE=0.60;
    var FINAL_SWITCH_SCALE=1.50; // 125% من الحجم الحالي (1.20 من الحجم الأساسي -> 1.50)
    var TARGET_HEIGHT=BASE_TARGET_HEIGHT*FINAL_SWITCH_SCALE;
    var TARGET_PLAN=BASE_TARGET_PLAN*FINAL_SWITCH_SCALE;

    /* الارتفاع السابق 1.288م -> رفعه 15%، ونُبقيه كما هو في الطلب السابق. */
    var CURRENT_CENTER_Y=1.288;
    var SWITCH_CENTER_Y=CURRENT_CENTER_Y*1.15;

    /* fallback داخلي فقط لو فشل وصول الـGLB؛ لا يعتمد على أي ملف إضافي. */
    var plateMat=new THREE.MeshStandardMaterial({color:0xf1eee7,roughness:0.62,metalness:0.03});
    var rockerMat=new THREE.MeshStandardMaterial({color:0xd8d5ce,roughness:0.42,metalness:0.02});

    function addFallbackSwitch(item){
      var group=new THREE.Group();
      /* fallback أيضًا ضعف حجم النسخة الحالية السابقة، حتى يطابق الـGLB تمامًا عند الحاجة. */
      var plate=new THREE.Mesh(
        new THREE.BoxGeometry(0.0864,0.1728,0.018),plateMat
      );
      var rocker=new THREE.Mesh(
        new THREE.BoxGeometry(0.04896,0.0936,0.02304),rockerMat
      );
      rocker.position.z=0.020;
      group.add(plate,rocker);
      group.rotation.y=item.rot;

      var wallHalf=(item.wall==='x'?T:t)/2;
      var y=SWITCH_CENTER_Y;
      if(item.wall==='x'){
        group.position.set(item.x + item.side*(wallHalf+0.004),y,item.z);
      }else{
        group.position.set(item.x,y,item.z + item.side*(wallHalf+0.004));
      }
      group.userData.isDecorativeSwitch=true;
      group.userData.locationName=item.name;
      scene.add(group);
    }

    function prepareSource(source){
      source.visible=true;
      source.traverse(function(o){
        if(o.isMesh){
          o.visible=true;
          o.frustumCulled=false;
          if(o.material){
            var mats=Array.isArray(o.material)?o.material:[o.material];
            mats.forEach(function(m){
              m.visible=true;
              m.transparent=false;
              m.opacity=1;
              m.needsUpdate=true;
            });
          }
        }
      });
    }

    function buildScaledTemplate(source){
      /* الخطأ السابق: وضع الموديل اعتمادًا على نصف حجمه أدى إلى فراغ مع الحائط.
         هنا نحسب الـbounding box بعد التدوير ونلصق وجهه الفعلي بسطح الحائط. */
      source.position.set(0,0,0);
      source.rotation.set(0,0,0);
      source.scale.set(1,1,1);
      source.updateMatrixWorld(true);

      var box=new THREE.Box3().setFromObject(source);
      if(box.isEmpty()) return null;

      var size=box.getSize(new THREE.Vector3());
      var plan=Math.max(size.x,size.z);
      var scale=Math.min(
        TARGET_HEIGHT/Math.max(size.y,1e-6),
        TARGET_PLAN/Math.max(plan,1e-6)
      );
      if(!isFinite(scale)||scale<=0) return null;

      source.scale.set(scale,scale,scale);
      source.updateMatrixWorld(true);
      box.setFromObject(source);

      /* مركز هندسي: يضمن أن 6 النسخ تستخدم نفس نقطة مرجعية. */
      var c=box.getCenter(new THREE.Vector3());
      source.position.sub(c);
      source.updateMatrixWorld(true);
      return source;
    }

    function placeSwitch(sw,item){
      /*
        تثبيت السويتش على وجه الحائط نفسه:
        1) نضعه على مرساة الحائط.
        2) نُسقط Box3 بعد التدوير.
        3) نحسب فرق السطح الحقيقي.
        4) نُزحزحه بهذا الفرق فقط.
        لا يوجد inset ولا مسافة أمان مخفية.
      */
      sw.rotation.y=item.rot;
      sw.position.set(item.x,SWITCH_CENTER_Y,item.z);
      sw.updateMatrixWorld(true);

      var box=new THREE.Box3().setFromObject(sw);
      if(box.isEmpty()) throw new Error('Light switch clone has empty bounds');

      var wallHalf=(item.wall==='x'?T:t)/2;
      var wallSurface;
      var delta;

      if(item.wall==='x'){
        wallSurface=item.x + item.side*wallHalf;
        if(item.side<0){
          /* الغرفة 1: الوجه الداخلي هو الجهة السالبة من X. */
          delta=wallSurface-box.max.x;
        }else{
          /* الغرفة 2: الوجه الداخلي هو الجهة الموجبة من X. */
          delta=wallSurface-box.min.x;
        }
        sw.position.x += delta;
      }else{
        wallSurface=item.z + item.side*wallHalf;
        if(item.side<0){
          delta=wallSurface-box.max.z;
        }else{
          delta=wallSurface-box.min.z;
        }
        sw.position.z += delta;
      }

        /* تثبيت ارتفاع المركز فقط؛ لا نغيّر Y عند تصحيح ملاصقة الحائط. */
      sw.position.y=SWITCH_CENTER_Y;

      /* تحقق أخير: بعد الزحزحة يجب أن يكون وجه الـGLB على سطح الحائط ضمن دقة عددية صغيرة. */
      sw.updateMatrixWorld(true);
      var verify=new THREE.Box3().setFromObject(sw);
      var surfaceError=0;
      if(item.wall==='x'){
        surfaceError=(item.side<0 ? verify.max.x : verify.min.x) - (item.x + item.side*wallHalf);
      }else{
        surfaceError=(item.side<0 ? verify.max.z : verify.min.z) - (item.z + item.side*wallHalf);
      }
      if(Math.abs(surfaceError)>0.00001){
        if(item.wall==='x') sw.position.x-=surfaceError;
        else sw.position.z-=surfaceError;
      }

      /* الغرفتان فقط: بعد تثبيت السويتش على سطح الحائط، أبعده 1.5 سم داخل الغرفة.
         room 1 تتحرك باتجاه -X، room 2 باتجاه +X. */
      var ROOM_SWITCH_WALL_DISTANCE=-0.040;
      if(item.name==='غرفة 1' || item.name==='غرفة 2'){
        sw.position.x += item.side * ROOM_SWITCH_WALL_DISTANCE;
      }

      sw.userData.isDecorativeSwitch=true;
      sw.userData.locationName=item.name;
      sw.userData.wallAttached=true;
      scene.add(sw);
    }

    loader.load(LIGHT_SWITCH_GLB_URL,function(gltf){
      var source=gltf.scene;
      prepareSource(source);
      var template=buildScaledTemplate(source);
      if(!template){
        console.warn('موديل السويتش فارغ أو حجمه غير صالح');
        positions.forEach(addFallbackSwitch);
        return;
      }

      /* الخطأ السابق الثالث: إضافة source إلى scene ثم حذفه ثم نسخه يمكن أن
         يترك matrixWorld قديمًا على بعض النسخ. نحتفظ بالقالب خارج المشهد
         ونحدّثه قبل كل clone؛ التحميل نفسه ما زال مرة واحدة فقط. */
      positions.forEach(function(item){
        try{
          var sw=template.clone(true);
          sw.visible=true;
          prepareSource(sw);
          placeSwitch(sw,item);
        }catch(err){
          console.warn('فشل وضع مفتاح '+item.name,err);
          addFallbackSwitch(item);
        }
      });
    },undefined,function(err){
      console.warn('تعذر تحميل موديل مفتاح الإضاءة مرة واحدة',err);
      positions.forEach(addFallbackSwitch);
    });
  }

  if(window.THREE && THREE.GLTFLoader){
    afterLoaderReady();
  }else{
    var s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js';
    s.onload=afterLoaderReady;
    s.onerror=function(){ console.warn('تعذر تحميل GLTFLoader لمفتاح الإضاءة'); };
    document.head.appendChild(s);
  }
}

function addBathSinkAndTowel(){
  withGLTFLoader(function(loader){
    /* المغسلة: على الحيطة الشرقية (اليمين) للحمام — وشها الداخلي x=10.924 — بحجم 160% (0.62 → 0.992)، ووشها ناحية الحمام (-x) */
    loader.load(SINK_GLB_URL,function(gltf){
      var sk=gltf.scene; prepareFurnitureModel(sk); scene.add(sk);
      var SINK_W=0.62*1.6, SINK_Z=2.0, EAST_FACE_X=10.924;
      sk.rotation.y=-Math.PI/2; scene.updateMatrixWorld(true);
      var box=new THREE.Box3().setFromObject(sk), size=box.getSize(new THREE.Vector3());
      var m=Math.max(size.x,size.z); if(m>1e-4){ sk.scale.multiplyScalar(SINK_W/m); scene.updateMatrixWorld(true); box.setFromObject(sk); }
      var c=box.getCenter(new THREE.Vector3());
      sk.position.z+=SINK_Z-c.z;
      sk.position.x+=(EAST_FACE_X-0.01)-box.max.x;
      sk.position.y+=0.002-box.min.y;
      scene.updateMatrixWorld(true); box.setFromObject(sk);
      pushRect(box.min.x,box.min.z,box.max.x,box.max.z,box.max.y);
      bakeLighting();
    },undefined,function(err){ console.warn('تعذر تحميل المغسلة',err); });
    /* شمّاعة الفوط: على الحيطة الشمالية (z=0.20) بين البانيو والتويلت، وشها للحمام (+z) */
    loader.load(TOWEL_GLB_URL,function(gltf){
      var tw=gltf.scene; prepareFurnitureModel(tw); scene.add(tw);
      var TW_W=0.60, TW_X=9.25, NORTH_FACE_Z=0.20, TW_CENTER_Y=1.15;
      tw.rotation.y=0; scene.updateMatrixWorld(true);
      var box=new THREE.Box3().setFromObject(tw), size=box.getSize(new THREE.Vector3());
      if(size.x>1e-4){ tw.scale.multiplyScalar(TW_W/size.x); scene.updateMatrixWorld(true); box.setFromObject(tw); size=box.getSize(new THREE.Vector3()); }
      var c=box.getCenter(new THREE.Vector3());
      tw.position.x+=TW_X-c.x;
      tw.position.z+=(NORTH_FACE_Z+0.01)-box.min.z;
      var standing=size.y>0.7;                                   // لو الموديل حامل واقف يتحط على الأرض، غير كده يتعلّق على الحيطة
      tw.position.y+= standing ? (0.002-box.min.y) : (TW_CENTER_Y-c.y);
      scene.updateMatrixWorld(true); box.setFromObject(tw);
      if(standing) pushRect(box.min.x,box.min.z,box.max.x,box.max.z,box.max.y);
      bakeLighting();
    },undefined,function(err){ console.warn('تعذر تحميل شمّاعة الفوط',err); });
  },'المغسلة');
}

    loader.load(RUG_GLB_URL,function(gltf){
      ROOM_RUGS.forEach(function(spec){
        var rug=gltf.scene.clone(true), cache=[];
        rug.traverse(function(o){
          if(!o.isMesh) return;
          if(o.geometry) o.geometry=o.geometry.clone();
          var arr=Array.isArray(o.material)?o.material:[o.material];
          var out=arr.map(function(m){
            var i=cache.findIndex(function(p){ return p.src===m; });
            if(i>=0) return cache[i].dst;
            var c=m.clone();
            if(c.map){ c.map=gradientMapTexture(c.map,spec.stops); if(c.color) c.color.setHex(0xffffff); }
            else if(c.color){ var l=0.299*c.color.r+0.587*c.color.g+0.114*c.color.b; c.color.copy(_gradAt(spec.stops.map(function(x){ return new THREE.Color(x); }),l)); _srgbFix(c.color); }
            c.needsUpdate=true; cache.push({src:m,dst:c}); return c;
          });
          o.material=Array.isArray(o.material)?out:out[0];
        });
        prepareFurnitureModel(rug);
        scene.add(rug);
        rug.rotation.y=0; scene.updateMatrixWorld(true);
        var box=new THREE.Box3().setFromObject(rug), size=box.getSize(new THREE.Vector3());
        if(size.z>size.x){ rug.rotation.y=Math.PI/2; scene.updateMatrixWorld(true); box.setFromObject(rug); size=box.getSize(new THREE.Vector3()); }
        if(size.x>1e-4&&size.z>1e-4){ rug.scale.x*=spec.w/size.x; rug.scale.z*=spec.l/size.z; scene.updateMatrixWorld(true); box.setFromObject(rug); }
        var c=box.getCenter(new THREE.Vector3());
        rug.position.x+=spec.x-c.x; rug.position.z+=spec.z-c.z; rug.position.y+=0.004-box.min.y;
        scene.updateMatrixWorld(true);
      });
      bakeLighting();
    },undefined,function(err){ console.warn('تعذر تحميل سجاد الغرف',err); });
  },'السجاد');
}

var SOFA_TABLE_GLB_URL='https://raw.githubusercontent.com/abdrahman20091228-ux/Your-choice-/880b4b705aa8ac5e1ee6876911d9a73418e129e5/Coffee%20Table%20by%20Francisco%20Hui%20-%20dP74Xz2DlMe.glb';

/* ارتفاع سطح ترابيزة القهوة الفعلي (يُحسب بعد تحميل الموديل) — الكوب والريموت ينتظروه ويتحطوا فوقه */
var sofaTableTopY=null, sofaTableTopWaiters=[];
function setSofaTableTop(y){ sofaTableTopY=y; sofaTableTopWaiters.splice(0).forEach(function(f){ f(y); }); }
function onSofaTableTop(cb){ if(sofaTableTopY!==null) cb(sofaTableTopY); else sofaTableTopWaiters.push(cb); }

function addSofaCoffeeTable(){
  function afterLoaderReady(){
    var loader=new THREE.GLTFLoader();
    loader.load(SOFA_TABLE_GLB_URL, function(gltf){
      var table=gltf.scene;
      
      // الحفاظ على شفافية الزجاج ونقاء خامات الترابيزة
      table.traverse(function(o){
        if(o.isMesh){
          o.frustumCulled = true;
          if(o.material){
            if(o.material.transparent || o.material.opacity < 1){
              o.material.depthWrite = false;
            }
            o.material.vertexColors = true;
          }
          bakeMeshes.push(o);
        }
      });
      scene.add(table);

      // مقاس ملموم ومناسب للمساحة الضيقة
      var TABLE_TARGET_WIDTH = 1.31; 
      var TABLE_X = 14.45; // متسنترة مع الكنبة والتلفزيون
      var TABLE_Z = 6.55;  // تترك ممر مشي مريح جداً بينها وبين الكنبة

      scene.updateMatrixWorld(true);
      var box=new THREE.Box3().setFromObject(table);
      var size=box.getSize(new THREE.Vector3());

      if(size.x > 0.0001){
        table.scale.multiplyScalar(TABLE_TARGET_WIDTH / size.x);
        scene.updateMatrixWorld(true);
        box.setFromObject(table);
      }

      // ضبط موضع الترابيزة وقاعدتها فوق السجادة مباشرة
      var center=box.getCenter(new THREE.Vector3());
      table.position.x += TABLE_X - center.x;
      table.position.z += TABLE_Z - center.z;
      table.position.y += (0.006 - box.min.y);

      // تصادم دقيق ومقلص جداً لمنع أي جدار غير مرئي في الممر
      scene.updateMatrixWorld(true);
      box.setFromObject(table);
      setSofaTableTop(box.max.y);
      var marginX = 0.15;
      var marginZ = 0.12;
      pushRect(box.min.x + marginX, box.min.z + marginZ, box.max.x - marginX, box.max.z - marginZ, box.max.y);

      scene.updateMatrixWorld(true);
      bakeLighting(); // إعادة خبز الإضاءة وظل الترابيزة على السجادة
    }, undefined, function(err){
      console.warn('تعذر تحميل موديل ترابيزة القهوة', err);
      setSofaTableTop(0.49);
    });
  }

  if(window.THREE && THREE.GLTFLoader){
    afterLoaderReady();
  } else {
    var s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js';
    s.onload=afterLoaderReady;
    s.onerror=function(){ console.warn('تعذر تحميل GLTFLoader للترابيزة'); };
    document.head.appendChild(s);
  }
}

/* ========== كوب الماء (water_cup.glb) على ترابيزة القهوة + نسخة سودا بقهوة في الطرف التاني ==========
   الموديل بيتحمّل مرة، وبيتنسخ. الماء بيتعرف من الاسم، وإلا من الشكل (مجسم جوّه الكوب تحت الحافة)، وإلا من اللون الأزرق. */
function cupClone(base){
  var c=base.clone(true);
  c.traverse(function(o){
    if(!o.isMesh) return;
    if(o.geometry) o.geometry=o.geometry.clone();                      // هندسة مستقلة لكل كوب (الإضاءة المخبوزة مختلفة)
    if(Array.isArray(o.material)) o.material=o.material.slice();       // مصفوفة خامات مستقلة (الـclone بيشارك نفس المصفوفة)
  });
  return c;
}
function cupClassify(root){
  root.updateMatrixWorld(true);
  var meshes=[], out={water:[],shell:[]}, waterRe=/water|liquid|fluid|drink|juice|milk|tea|coffee|wine|ماء|مياه/i;
  root.traverse(function(o){ if(o.isMesh&&o.material) meshes.push(o); });
  function slots(o){ var arr=Array.isArray(o.material); return (arr?o.material:[o.material]).map(function(m,i){ return {mesh:o,i:arr?i:-1,m:m}; }); }
  /* 1) بالاسم */
  meshes.forEach(function(o){
    var named=waterRe.test(o.name||'');
    slots(o).forEach(function(p){ ((named||waterRe.test((p.m&&p.m.name)||''))?out.water:out.shell).push(p); });
  });
  if(out.water.length) return out;
  out={water:[],shell:[]};
  /* 2) بالشكل: مجسم داخل صندوق أكبر مجسم وتحت حافته */
  var isWater={};
  if(meshes.length>=2){
    var infos=meshes.map(function(o){ var b=new THREE.Box3().setFromObject(o), sz=b.getSize(new THREE.Vector3()); return {o:o,b:b,s:sz,vol:sz.x*sz.y*sz.z}; });
    infos.sort(function(a,c){ return c.vol-a.vol; });
    var ou=infos[0], eps=0.02*Math.max(ou.s.x,ou.s.z), rim=ou.b.max.y-0.02*ou.s.y;
    infos.slice(1).forEach(function(f){
      if(f.b.min.x>=ou.b.min.x-eps&&f.b.max.x<=ou.b.max.x+eps&&f.b.min.z>=ou.b.min.z-eps&&f.b.max.z<=ou.b.max.z+eps&&f.b.max.y<=rim) isWater[f.o.uuid]=true;
    });
  }
  /* 3) باللون الأزرق */
  meshes.forEach(function(o){
    slots(o).forEach(function(p){
      var c=p.m&&p.m.color, blue=c&&(c.b>c.r+0.05&&c.b>=c.g-0.03);
      (isWater[o.uuid]||blue?out.water:out.shell).push(p);
    });
  });
  return out;
}
function cupSetMat(p,mat){ if(p.i<0) p.mesh.material=mat; else p.mesh.material[p.i]=mat; }
function fillWaterToBrim(root,waterSlots){
  /* يرفع سطح الماء لحد حافة الكوب: تمدّد رأسي لرؤوس الماء فقط (في الإحداثيات العالمية) — الكوب نفسه ما بيتغيرش */
  root.updateMatrixWorld(true);
  var full=new THREE.Box3().setFromObject(root), H=full.max.y-full.min.y;
  if(!(H>1e-5)) return;
  var targetY=full.max.y-0.012*H;                    // تحت الحافة بشعرة عشان ما يحصلش z-fighting
  var byMesh=[], seen={};
  waterSlots.forEach(function(p){
    var e=seen[p.mesh.uuid];
    if(!e){ e=seen[p.mesh.uuid]={mesh:p.mesh,idx:[],all:false}; byMesh.push(e); }
    if(p.i<0||!Array.isArray(p.mesh.material)) e.all=true; else e.idx.push(p.i);
  });
  var v=new THREE.Vector3(), lo=Infinity, hi=-Infinity;
  byMesh.forEach(function(e){
    var g=e.mesh.geometry, pos=g.attributes.position, ix=g.index, set={};
    if(e.all||!g.groups.length){ for(var i=0;i<pos.count;i++) set[i]=1; }
    else e.idx.forEach(function(mi){ g.groups.forEach(function(gr){
      if(gr.materialIndex!==mi) return;
      for(var k=gr.start;k<gr.start+gr.count;k++) set[ix?ix.getX(k):k]=1;
    }); });
    e.set=set;
    for(var key in set){ v.fromBufferAttribute(pos,+key).applyMatrix4(e.mesh.matrixWorld); if(v.y<lo)lo=v.y; if(v.y>hi)hi=v.y; }
  });
  if(!isFinite(lo)||!isFinite(hi)) return;
  var span=hi-lo, thin=span<0.02*H, k=thin?1:(targetY-lo)/span, dy=thin?(targetY-hi):0;
  if(!thin&&(k<=1.001||k>3)) return;                 // مفيش حاجة تتعدّل / أو التصنيف مش مضبوط — نسيبه زي ما هو
  if(thin&&dy<=0) return;
  byMesh.forEach(function(e){
    var g=e.mesh.geometry, pos=g.attributes.position, inv=new THREE.Matrix4().copy(e.mesh.matrixWorld).invert();
    for(var key in e.set){
      var i=+key; v.fromBufferAttribute(pos,i).applyMatrix4(e.mesh.matrixWorld);
      v.y = thin ? v.y+dy : lo+(v.y-lo)*k;
      v.applyMatrix4(inv); pos.setXYZ(i,v.x,v.y,v.z);
    }
    pos.needsUpdate=true; g.computeBoundingBox(); g.computeBoundingSphere();
  });
}
function styleWaterCup(root){
  /* الماء أزرق خفيف شبه شفاف، وبيتملي لحد حافة الكوب */
  var water=cupClassify(root).water;
  water.forEach(function(p){
    cupSetMat(p,new THREE.MeshStandardMaterial({color:0x2a96ee,transparent:true,opacity:0.5,roughness:0.03,metalness:0,depthWrite:false,side:THREE.DoubleSide,vertexColors:true}));
  });
  fillWaterToBrim(root,water);
}
function styleCoffeeCup(root){
  /* الكوب أسود لامع، والسائل جواه بني (قهوة). بيرجّع true لو ما لقيناش مجسم السائل (نضيف قرص قهوة بدله) */
  var cls=cupClassify(root);
  cls.shell.forEach(function(p){ cupSetMat(p,new THREE.MeshStandardMaterial({color:0x0b0b0d,roughness:0.28,metalness:0.15,side:THREE.DoubleSide,vertexColors:true})); });
  cls.water.forEach(function(p){ cupSetMat(p,new THREE.MeshStandardMaterial({color:0x3a2113,roughness:0.3,metalness:0,side:THREE.DoubleSide,vertexColors:true})); });
  return cls.water.length===0;
}
function placeCupOnTable(cup,x,z,topY,dia,rotDeg){
  cup.rotation.y=(rotDeg||0)*Math.PI/180;
  scene.add(cup); scene.updateMatrixWorld(true);
  var b=new THREE.Box3().setFromObject(cup), sz=b.getSize(new THREE.Vector3()), d=Math.max(sz.x,sz.z);
  if(d>1e-4) cup.scale.multiplyScalar(dia/d);
  scene.updateMatrixWorld(true); b.setFromObject(cup);
  var c=b.getCenter(new THREE.Vector3());
  cup.position.x+=x-c.x; cup.position.z+=z-c.z; cup.position.y+=topY+0.002-b.min.y;
  scene.updateMatrixWorld(true);
}
function addTeaCup(){
  function afterLoaderReady(){
    var loader=new THREE.GLTFLoader();
    loader.load(CUP_TEA_GLB_URL,function(gltf){
      var cupW=cupClone(gltf.scene), cupB=cupClone(gltf.scene);
      styleWaterCup(cupW);
      var needDisc=styleCoffeeCup(cupB);
      prepareFurnitureModel(cupW); prepareFurnitureModel(cupB);
      /* مركز ترابيزة القهوة = (14.45, 6.55) وعرضها ~1.31م. كوب الماء على الطرف اليمين (كما كان كوب الشاي)، والريموت على اليسار.
         الكوب الأسود عند الطرف الأيسر البعيد وبإزاحة بسيطة عن المحور — عشان يبان عفوي مش مرصوص. */
      onSofaTableTop(function(topY){
        placeCupOnTable(cupW,14.45+0.32,6.55,topY,0.19975,160);   // كوب الماء: 47% من الحجم السابق (0.425→0.19975) + دوران 160°
        placeCupOnTable(cupB,14.45-0.52,6.55-0.11,topY,0.1786,46);   // الكوب الأسود: 47% من الحجم السابق (0.38→0.1786) + دوران 46°
        if(needDisc){   // ما لقيناش السائل في الموديل: قرص قهوة بني جوّه الكوب الأسود قرب الحافة
          var bb=new THREE.Box3().setFromObject(cupB), bs=bb.getSize(new THREE.Vector3()), bc=bb.getCenter(new THREE.Vector3());
          var disc=new THREE.Mesh(new THREE.CylinderGeometry(Math.max(bs.x,bs.z)*0.30,Math.max(bs.x,bs.z)*0.30,0.002,24),
            new THREE.MeshStandardMaterial({color:0x3a2113,roughness:0.3,metalness:0,vertexColors:false}));
          disc.position.set(bc.x,bb.max.y-bs.y*0.12,bc.z); scene.add(disc);
        }
        bakeLighting();
      });
    },undefined,function(err){
      console.warn('تعذر تحميل موديل الكوب',err);
    });
  }

  if(window.THREE && THREE.GLTFLoader){
    afterLoaderReady();
  }else{
    var s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js';
    s.onload=afterLoaderReady;
    s.onerror=function(){ console.warn('تعذر تحميل GLTFLoader للكوب'); };
    document.head.appendChild(s);
  }

/* ========== غرفة 2 (المشتركة مع الصالة): كراتين في الركن + رف ، وغرفة النوم (غرفة 1): دولاب ========== */
var BOXES_GLB_URL='https://raw.githubusercontent.com/abdrahman20091228-ux/Your-choice-/40f3fedfea77d0a5d75fbbc2f7a61907ac0fb67f/Cardboard%20Boxes%20by%20Quaternius%20-%20V9KbWC8Vd6.glb';
var SHELF_GLB_URL='https://raw.githubusercontent.com/abdrahman20091228-ux/Your-choice-/e4e451f0a42b5838a96a2b6d93b80a44e98b89e2/Shelf%20by%20Julien%20Kleber%20(Juliusprod)%20-%204Tfidw7Oqna.glb';
var CLOSET_GLB_URL='https://raw.githubusercontent.com/abdrahman20091228-ux/Your-choice-/1ae87dd8718a8cd0cca25a8e44ced99e6c168c90/Closet%20by%20Poly%20by%20Google%20-%200Cuf7Rv4SfV.glb';
/* بيحط موديل ملزوق في حيطة: face = ناحية وش الموديل ('-z' | '+z' | '-x' | '+x') ، wallCoord = سطح الحيطة ، along = مركزه على امتداد الحيطة */
function placeAgainstWall(o,axis,wallCoord,along,face,maxW,maxH,flip,extraRot){
  var rotMap={'-z':Math.PI,'+z':0,'-x':-Math.PI/2,'+x':Math.PI/2};   // وش الموديل الافتراضي = +z
  o.rotation.y=rotMap[face]+(flip?Math.PI:0)+(extraRot||0); scene.updateMatrixWorld(true);   // flip = عكس الموديل 180° ، extraRot = لفة إضافية
  if(extraRot!==undefined){                                   // الرف لازم طوله يمشي موازي للحيطة (ضهره ملزوق فيها) مش عمودي عليها
    var pb=new THREE.Box3().setFromObject(o), ps=pb.getSize(new THREE.Vector3());
    if(axis==='z' ? ps.z>ps.x : ps.x>ps.z){ o.rotation.y+=Math.PI/2; scene.updateMatrixWorld(true); }
  }
  var box=new THREE.Box3().setFromObject(o), size=box.getSize(new THREE.Vector3());
  var sc=Math.min(maxW/Math.max(size.x,size.z,1e-4), maxH/Math.max(size.y,1e-4));
  o.scale.multiplyScalar(sc); scene.updateMatrixWorld(true); box.setFromObject(o);
  var c=box.getCenter(new THREE.Vector3());
  if(axis==='z'){                                   // حيطة عمودية على z (الوش ناحية -z أو +z)
    o.position.x+=along-c.x;
    o.position.z+= (face==='-z') ? (wallCoord-0.01-box.max.z) : (wallCoord+0.01-box.min.z);
  }else{                                            // حيطة عمودية على x
    o.position.z+=along-c.z;
    o.position.x+= (face==='-x') ? (wallCoord-0.01-box.max.x) : (wallCoord+0.01-box.min.x);
  }
  o.position.y+=0.005-box.min.y;
  scene.updateMatrixWorld(true); box.setFromObject(o);
  pushRect(box.min.x,box.min.z,box.max.x,box.max.z,box.max.y);
}
function addRoomExtras(){

    /* كراتين: ركن غرفة 2 الجنوبي الشرقي (الحيطة المشتركة مع الصالة z=4.04 + الحيطة الشرقية x=17.38) */
    loader.load(BOXES_GLB_URL,function(gltf){
      var o=gltf.scene; prepareFurnitureModel(o); scene.add(o);

    },undefined,function(err){ console.warn('تعذر تحميل الكراتين',err); });
    /* رف: نفس الغرفة، على حيطة الديسك (الشمالية) */

      bakeLighting();

/* ---- وش المرآة: بنحدد ناحية سطح الزجاج العاكس (الأقرب للوش) ونخليه دايمًا مقابل للفراغ. لو الموديل مالوش زجاج واضح بنرجع null ونعمل عكس 180° ---- */
function mirrorFrontDir(o){
  o.updateMatrixWorld(true);
  var box=new THREE.Box3().setFromObject(o), size=box.getSize(new THREE.Vector3()), ctr=box.getCenter(new THREE.Vector3());
  var n=(size.x<=size.y&&size.x<=size.z)?0:(size.y<=size.z?1:2), best=null, bestArea=0;
  o.traverse(function(m){
    if(!m.isMesh||!m.geometry||!m.material) return;
    var mats=Array.isArray(m.material)?m.material:[m.material];
    var glass=mats.some(function(mt){ return /mirror|glass|refl/i.test(((mt&&mt.name)||'')+' '+(m.name||'')) || (mt&&mt.metalness>=0.9&&mt.roughness<=0.15); });
    if(!glass) return;
    var mb=new THREE.Box3().setFromObject(m), ms=mb.getSize(new THREE.Vector3()), mc=mb.getCenter(new THREE.Vector3());

    if(p<pMin) pMin=p; if(p>pMax) pMax=p; if(w<wMin) wMin=w; if(w>wMax) wMax=w;

}
function clockTipDir(c,C){                               // اتجاه طرف العقرب البعيد عن المحور
  var along=(C[0]-c.mean[0])*c.dir[0]+(C[1]-c.mean[1])*c.dir[1];
  var s=((c.pMax-along)>=(along-c.pMin))?1:-1;
  return [c.dir[0]*s, c.dir[1]*s];
}
/* يقسّم مجسم لمكوّنات متصلة (بيلحم الرؤوس المتطابقة مكانيًا عشان الأجزاء اللي فيها UV seams تفضل متصلة) */
function clockWeldComponents(getX,getY,getZ,n,idx,triN,q){
  var wmap=new Map(), weld=new Int32Array(n), wc=0, i, k, id;
  for(i=0;i<n;i++){
    var key=Math.round(getX(i)/q)+'_'+Math.round(getY(i)/q)+'_'+Math.round(getZ(i)/q);
    id=wmap.get(key); if(id===undefined){ id=wc++; wmap.set(key,id); }
    weld[i]=id;
  }
  var par=new Int32Array(wc); for(i=0;i<wc;i++) par[i]=i;
  function find(a){ while(par[a]!==a){ par[a]=par[par[a]]; a=par[a]; } return a; }
  function vi(j){ return idx?idx[j]:j; }
  for(k=0;k<triN;k++){
    var wa=weld[vi(3*k)], wb=weld[vi(3*k+1)], wcc=weld[vi(3*k+2)];
    var ra=find(wa), rb=find(wb); if(ra!==rb) par[rb]=ra;
    ra=find(wa); var rc=find(wcc); if(rc!==ra) par[rc]=ra;
  }
  var groups=new Map();
  for(k=0;k<triN;k++){
    var r=find(weld[vi(3*k)]), arr=groups.get(r);
    if(!arr){ arr=[]; groups.set(r,arr); }
    arr.push(k);
  }
  var out=[]; groups.forEach(function(t){ out.push(t); });
  return out;
}
function clockTriMaterial(m,t){
  if(!Array.isArray(m.material)) return m.material;
  var pos=3*t, gr=m.geometry.groups.filter(function(x){ return pos>=x.start && pos<x.start+x.count; })[0];
  return m.material[gr?gr.materialIndex:0];
}
/* ينقل عقرب (مكوّن) لمحوره: لو المجسم كله عقرب بننقله زي ما هو، وإلا بننسخ مثلثاته لمجسم جديد ونعطّلها من الأصل */
function clockExtract(c,pivot){
  var m=c.mesh, g=m.geometry, idx=g.index?g.index.array:null;
  var total=Math.floor((idx?idx.length:g.attributes.position.count)/3);
  if(c.tris.length>=total){ pivot.attach(m); return; }
  var nv=c.tris.length*3, hg=new THREE.BufferGeometry();
  ['position','normal','uv','color'].forEach(function(name){
    var a=g.attributes[name]; if(!a) return;
    var s=a.itemSize, arr=new Float32Array(nv*s), p=0;
    c.tris.forEach(function(t){
      for(var j=0;j<3;j++){
        var vv=idx?idx[3*t+j]:3*t+j;
        arr[p++]=a.getX(vv); if(s>1) arr[p++]=a.getY(vv); if(s>2) arr[p++]=a.getZ(vv); if(s>3) arr[p++]=a.getW(vv);
      }
    });
    hg.setAttribute(name,new THREE.BufferAttribute(arr,s));
  });
  var hm=new THREE.Mesh(hg,clockTriMaterial(m,c.tris[0]));
  hm.applyMatrix4(new THREE.Matrix4().copy(pivot.matrixWorld).invert().multiply(m.matrixWorld));
  pivot.add(hm);
  if(!g.index){ var seq=new Uint32Array(total*3); for(var i=0;i<seq.length;i++) seq[i]=i; g.setIndex(new THREE.BufferAttribute(seq,1)); idx=seq; }
  c.tris.forEach(function(t){ var a0=idx[3*t]; idx[3*t+1]=a0; idx[3*t+2]=a0; });   // مثلثات منعدمة = تختفي من الأصل
  g.index.needsUpdate=true;
}
/* يبني الساعة: يكتشف العقارب ويعزل كل واحد في pivot، ويرجّع {holder, Nf, dia, hands} */
function clockBuild(root){
  var holder=new THREE.Group(); holder.add(root); holder.updateMatrixWorld(true);
  var box=new THREE.Box3().setFromObject(holder), size=box.getSize(new THREE.Vector3()), ctr=box.getCenter(new THREE.Vector3());
  var nI=(size.x<=size.y && size.x<=size.z)?0:(size.y<=size.z?1:2);   // أرفع بُعد = عمق الساعة (محور عمودي على الوجه)
  var uI=(nI===1)?2:1, rI=3-nI-uI;                                     // فوق = Y (الساعة واقفة) ، ويمين = المحور المتبقي
  var dia=Math.max(size.getComponent(rI),size.getComponent(uI));
  var C0=[ctr.getComponent(rI),ctr.getComponent(uI)];
  var comps=[], v=new THREE.Vector3();
  holder.traverse(function(m){
    if(!m.isMesh || m.isSkinnedMesh || !m.geometry || !m.geometry.attributes.position) return;
    var g=m.geometry, pa=g.attributes.position, n=pa.count, idx=g.index?g.index.array:null;
    var triN=Math.floor((idx?idx.length:n)/3); if(triN<1) return;
    g.computeBoundingSphere();
    var parts=clockWeldComponents(function(i){return pa.getX(i);},function(i){return pa.getY(i);},function(i){return pa.getZ(i);},
                                  n,idx,triN,Math.max(g.boundingSphere.radius*1e-4,1e-7));
    parts.forEach(function(tris){
      var seen=new Set(), pts=[], dsum=0;
      tris.forEach(function(t){
        for(var j=0;j<3;j++){
          var vv=idx?idx[3*t+j]:3*t+j; if(seen.has(vv)) continue; seen.add(vv);
          v.set(pa.getX(vv),pa.getY(vv),pa.getZ(vv)).applyMatrix4(m.matrixWorld);
          pts.push([v.getComponent(rI),v.getComponent(uI)]); dsum+=v.getComponent(nI);
        }
      });
      if(pts.length<3) return;
      var st=clockPcaStats(pts), col=clockTriMaterial(m,tris[0]); col=col&&col.color;
      st.depth=dsum/pts.length; st.mesh=m; st.tris=tris;
      st.red=!!col && col.r>0.5 && col.g<0.35 && col.b<0.35;             // العقرب الأحمر غالبًا هو الثواني
      comps.push(st);
    });
  });
  var pick=clockPickHands(comps,dia,C0), Nf=new THREE.Vector3(), hands=null;
  Nf.setComponent(nI,1);
  if(pick){
    var names=['hour','minute','second'], hd=0, cnt=0;
    names.forEach(function(k){ if(pick[k]){ hd+=pick[k].depth; cnt++; } });
    Nf.setComponent(nI,(hd/cnt-ctr.getComponent(nI))>=0?1:-1);           // وش الساعة = الناحية اللي فيها العقارب (بارزة قدام الضهر)
    var Up=new THREE.Vector3(); Up.setComponent(uI,1);
    var Right=new THREE.Vector3().crossVectors(Up,Nf);                   // اليمين زي ما الناظر للوجه بيشوفه
    var pivotPos=new THREE.Vector3();
    pivotPos.setComponent(rI,pick.center[0]); pivotPos.setComponent(uI,pick.center[1]); pivotPos.setComponent(nI,ctr.getComponent(nI));
    hands={};
    names.forEach(function(k){
      var c=pick[k]; if(!c) return;
      var pivot=new THREE.Group(); pivot.position.copy(pivotPos); holder.add(pivot); holder.updateMatrixWorld(true);
      clockExtract(c,pivot);
      var tip=clockTipDir(c,pick.center), dv=new THREE.Vector3();
      dv.setComponent(rI,tip[0]); dv.setComponent(uI,tip[1]);
      hands[k]={pivot:pivot, theta0:Math.atan2(dv.dot(Right),dv.dot(Up))};   // زاوية العقرب الأصلية في الموديل (مع عقارب الساعة من الـ12)
    });
  }
  return {holder:holder, Nf:Nf, dia:dia, hands:hands};
}
/* مراجع أماكن (التلفاز / السرير / شباك غرفة 2): بتتسجّل أول ما الموديل يتحمّل، والساعة بتستنى مرجعها — ولو الموديل ما اتحمّلش بنستخدم قيم احتياطية بعد 8 ثواني */
var placeRefs={}, placeWaiters={};
function refSet(name,box){ placeRefs[name]=box; (placeWaiters[name]||[]).splice(0).forEach(function(cb){ cb(box); }); }
function refOn(name,cb,fallbackBox){
  if(placeRefs[name]){ cb(placeRefs[name]); return; }
  (placeWaiters[name]=placeWaiters[name]||[]).push(cb);
  setTimeout(function(){ if(!placeRefs[name]) refSet(name,fallbackBox); },8000);
}
/* حركة العقارب — انسيابية (مش نقلة كل ثانية/دقيقة) — كل الساعات متزامنة. now = توقيت requestAnimationFrame بالمللي ثانية */
function clockTick(now){
  if(!wallClocks.length) return;
  var T=CLOCK_START_SEC+clockOffsetSec+Math.max(0,(now-clockT0)/1000), TAU=Math.PI*2;
  var aS=(T%60)/60*TAU, aM=(T%3600)/3600*TAU, aH=(T%43200)/43200*TAU;
  for(var i=0;i<wallClocks.length;i++){
    var h=wallClocks[i].hands, Nf=wallClocks[i].Nf; if(!h) continue;
    if(h.second) h.second.pivot.quaternion.setFromAxisAngle(Nf,-(aS-h.second.theta0));
    if(h.minute) h.minute.pivot.quaternion.setFromAxisAngle(Nf,-(aM-h.minute.theta0));
    if(h.hour)   h.hour.pivot.quaternion.setFromAxisAngle(Nf,-(aH-h.hour.theta0));
  }
}
/* بيحط نسخة مستقلة من الساعة على جدار: axis='z' (جدار عمودي على z) أو 'x' ، wall = وش الجدار ، faceSign = اتجاه وش الساعة (+1/-1) على المحور ده ،
   along = مركز الساعة على امتداد الجدار ، y = ارتفاع المركز ، diam = القطر */
var CLOCK_PALS=[
  {frame:0xd8a92e,face:0xf5e6b8,dark:0x3a2a10,second:0xc0392b},   // الصالة: دهبي
  {frame:0x2b6cb0,face:0xdbe9f8,dark:0x0d1b2e,second:0xf28c28},   // غرفة 2: أزرق
  {frame:0xb03a5b,face:0xf6dfe6,dark:0x2a0f18,second:0x1f7a5c}    // غرفة النوم: عنابي/وردي
];
function clockCloneMats(root){   // خامات مستقلة لكل ساعة (الـclone بيشارك الخامات) + حفظ اللون الأصلي للتصنيف
  var map=new Map();
  function cl(m){ if(!m) return m; var n=map.get(m); if(!n){ n=m.clone(); n.userData=Object.assign({},m.userData,{c0:m.color?m.color.clone():null}); map.set(m,n); } return n; }
  root.traverse(function(o){ if(!o.isMesh||!o.material) return; o.material=Array.isArray(o.material)?o.material.map(cl):cl(o.material); });
}
function clockPaint(m,tgt){
  if(!m||!m.color) return;
  if(m.map) m.color.set(0xffffff).lerp(new THREE.Color(tgt),0.75); else m.color.set(tgt);
  m.needsUpdate=true;
}
function clockRecolor(holder,pal,hands){
  /* 1) العقارب: خامة مستقلة لكل عقرب (ممكن تكون مشتركة مع الجسم) — الثواني بلون مميز والباقي غامق */
  var handMesh=new Set();
  if(hands) Object.keys(hands).forEach(function(k){
    hands[k].pivot.children.forEach(function(o){
      if(!o.isMesh||!o.material) return; handMesh.add(o);
      var tgt=(k==='second')?pal.second:pal.dark;
      var cl=function(m){ if(!m) return m; var n=m.clone(); clockPaint(n,tgt); return n; };
      o.material=Array.isArray(o.material)?o.material.map(cl):cl(o.material);
    });
  });
  /* 2) باقي الجسم: لو كل الخامات من نفس الفئة (مثلاً كلها بيضاء) نلوّنها كلها بلون الإطار عشان الفرق يبان بوضوح */
  var mats=[], seen=new Set(), hsl={};
  holder.traverse(function(o){
    if(!o.isMesh||!o.material||handMesh.has(o)) return;
    (Array.isArray(o.material)?o.material:[o.material]).forEach(function(m){
      if(!m||seen.has(m)||(m.transparent&&m.opacity<0.95)) return; seen.add(m);
      var c=(m.userData&&m.userData.c0)||m.color; if(!c) return;
      c.getHSL(hsl); mats.push({m:m,cls:(c.r>0.5&&c.g<0.35&&c.b<0.35)?'second':(hsl.l>0.6?'face':(hsl.l<0.22?'dark':'frame'))});
    });
  });
  var kinds={}; mats.forEach(function(e){ kinds[e.cls]=1; });
  var uniform=Object.keys(kinds).length<2;
  mats.forEach(function(e){ clockPaint(e.m,uniform?pal.frame:pal[e.cls]); });
}
function placeClock(src,axis,wall,faceSign,along,y,diam,pal){
  var root=src.clone(true);
  root.traverse(function(o){ if(o.isMesh && o.geometry) o.geometry=o.geometry.clone(); });
  clockCloneMats(root);   // هندسة مستقلة لكل ساعة (عشان عزل العقارب بيعدّل المثلثات)
  var b=clockBuild(root), h=b.holder;
  if(!b.hands) console.warn('الساعة: ما قدرتش أكتشف العقارب تلقائيًا — الساعة هتظهر ثابتة');
  if(pal) clockRecolor(h,pal,b.hands);
  prepareFurnitureModel(h);
  h.quaternion.setFromUnitVectors(b.Nf,(axis==='z')?new THREE.Vector3(0,0,faceSign):new THREE.Vector3(faceSign,0,0));
  h.scale.setScalar(diam/Math.max(b.dia,1e-4));
  scene.add(h); scene.updateMatrixWorld(true);
  var wb=new THREE.Box3().setFromObject(h), wc=wb.getCenter(new THREE.Vector3()), GAP=0.006;
  h.position.y+=y-wc.y;
  if(axis==='z'){ h.position.x+=along-wc.x; h.position.z+=(faceSign<0)?(wall-GAP-wb.max.z):(wall+GAP-wb.min.z); }
  else{           h.position.z+=along-wc.z; h.position.x+=(faceSign<0)?(wall-GAP-wb.max.x):(wall+GAP-wb.min.x); }
  scene.updateMatrixWorld(true);
  var cbx=new THREE.Box3().setFromObject(h);   // تصادم خفيف حوالين الساعة (بروزها + 3 سم)
  pushRect(cbx.min.x-0.03,cbx.min.z-0.03,cbx.max.x+0.03,cbx.max.z+0.03);
  wallClocks.push({hands:b.hands, Nf:b.Nf});
  clockTick(performance.now());
  bakeLighting();
}
function addWallClocks(){
  withGLTFLoader(function(loader){
    loader.load(CLOCK_GLB_URL,function(gltf){
      var src=gltf.scene; clockT0=performance.now();
      /* 1) الصالة: فوق التلفاز على جدار التلفاز (وجهه z=4.16) ووشها ناحية الصالة (+z) */
      refOn('tv',function(tv){
        var r=CLOCK_DIAMETER/2, y=Math.min(tv.max.y+0.14+0.07+r, H-0.2-r);   // مرفوعة 7 سم
        onLivingAC(function(ac){   // مزاحة 42 سم عن منتصف التلفاز في الناحية العكس للمكيف
          var cx=(tv.min.x+tv.max.x)/2, dir=(cx>=ac.x)?1:-1;
          placeClock(src,'z',4.16,+1,cx+dir*0.42,y,CLOCK_DIAMETER,CLOCK_PALS[0]);
        });
      },new THREE.Box3(new THREE.Vector3(13.64,0.48,4.3),new THREE.Vector3(15.26,1.45,4.8)));
      /* 2) غرفة 2: على الحيطة الشرقية (x=17.38) في الناحية التانية من الشباك عن اللوحة (ناحية الركن z=0.22)، ووشها ناحية الغرفة (-x)
            القطر بيتظبط على المساحة الفاضية بين الركن وحافة الشباك/الستارة */
      refOn('roomWin',function(wn){
        var wallZ=0.22, avail=Math.max(wn.min.z-wallZ,0.3), d=Math.min(CLOCK_DIAMETER,avail*0.8);
        placeClock(src,'x',17.38,-1,wallZ+avail/2,1.78,d,CLOCK_PALS[1]);   // مرفوعة 13 سم
      },new THREE.Box3(new THREE.Vector3(17.0,0.6,1.4),new THREE.Vector3(17.38,2.5,2.8)));
      /* 3) غرفة النوم: على الحيطة المقابلة للسرير (الحيطة الشرقية x=7.684، ناحية ذيل السرير) في منتصف عرض السرير بالظبط، ووشها ناحية السرير (-x) */
      refOn('bed',function(bd){
        placeClock(src,'x',7.684,-1,(bd.min.z+bd.max.z)/2,1.88,CLOCK_DIAMETER,CLOCK_PALS[2]);   // مرفوعة 13 سم
      },new THREE.Box3(new THREE.Vector3(0.21,0,0.21),new THREE.Vector3(2.7,0.9,1.9)));
    },undefined,function(err){ console.warn('تعذر تحميل الساعة',err); });
  },'الساعة');
}
addWallClocks();

/* ========== باب الشقة الرئيسي (موديل GLB) + لوحة الحائط يمين التلفاز ========== */
var FRONT_DOOR_GLB_URL='https://raw.githubusercontent.com/abdrahman20091228-ux/Your-choice-/eefffb062bb952935ff2c32a5430419653d40f10/Door%20by%20Poly%20by%20Google%20-%20dRvd7q2nO-6.glb';
var WALL_ART_GLB_URL='https://raw.githubusercontent.com/abdrahman20091228-ux/Your-choice-/6f09bbb38b5a6c69e0a647927ca11b72f57ba313/Wall%20Art%2006%20by%20Jarlan%20Perez%20-%202YYlC15J9SZ.glb';

function withGLTFLoader(cb,label){
  if(window.THREE && THREE.GLTFLoader){ cb(new THREE.GLTFLoader()); return; }
  var s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js';
  s.onload=function(){ cb(new THREE.GLTFLoader()); };
  s.onerror=function(){ console.warn('تعذر تحميل GLTFLoader لـ '+label); if(label==='الباب') addFallbackDoor(); };
  document.head.appendChild(s);
}

/* الباب: فتحة الجدار الغربي x=0.1 ، z من 7.6 إلى 8.5 (عرض 0.9) وارتفاع 2.05 — الموديل يتظبط على الفتحة (عرض/ارتفاع)
   وسمكه يتحصر جوه سمك الجدار T، وواجهته تبص لجوه الشقة (+x) */
function addFrontDoorModel(){
  withGLTFLoader(function(loader){
    loader.load(FRONT_DOOR_GLB_URL,function(gltf){
      var d=gltf.scene;
      prepareFurnitureModel(d);
      scene.add(d);
      var OPEN_W=0.9, OPEN_H=2.05, WALL_X=0.1, Z_MID=8.05;
      d.rotation.y=0; d.scale.set(1,1,1); scene.updateMatrixWorld(true);
      var b=new THREE.Box3().setFromObject(d), n=b.getSize(new THREE.Vector3());  // المقاس الأصلي للموديل
      var widthOnX=(n.x>=n.z);                        // أي محور محلي هو عرض الباب؟
      var nW=widthOnX?n.x:n.z, nD=widthOnX?n.z:n.x;
      var sy=OPEN_H/Math.max(n.y,1e-4);               // الارتفاع = ارتفاع الفتحة
      var sw=(OPEN_W+0.02)/Math.max(nW,1e-4);         // العرض = عرض الفتحة + 1سم كل جهة يختفوا جوه الجدار
      var sd=Math.min(sy,sw);                         // السمك بنسبة معقولة
      if(nD*sd>T) sd=T/Math.max(nD,1e-4);             // ما يزيدش عن سمك الجدار
      if(widthOnX){ d.rotation.y=Math.PI/2; d.scale.set(sw,sy,sd); }   // بعد الدوران العرض يبقى على محور z العالمي
      else        { d.rotation.y=0;         d.scale.set(sd,sy,sw); }
      scene.updateMatrixWorld(true);
      b.setFromObject(d);
      var c=b.getCenter(new THREE.Vector3());
      d.position.x+=WALL_X-c.x; d.position.z+=Z_MID-c.z; d.position.y+=0-b.min.y;
      scene.updateMatrixWorld(true);
      bakeLighting();
    },undefined,function(err){ console.warn('تعذر تحميل موديل الباب',err); addFallbackDoor(); });
  },'الباب');
}
addFrontDoorModel();

/* لوحة الحائط: على جدار التلفاز (وجهه الجنوبي z=4.16)، تحت مكيف الصالة مباشرة (نفس مركزه x)، ومعكوسة 180° */
function addWallArt(){
  withGLTFLoader(function(loader){
    loader.load(WALL_ART_GLB_URL,function(gltf){
      var a=gltf.scene;
      prepareFurnitureModel(a);
      var ART_SIZE=0.8*1.5, WALL_FACE_Z=4.16, GAP_UNDER_AC=0.12;   // 150% من الحجم السابق (0.8)
      a.rotation.y=0; scene.updateMatrixWorld(true);
      var b=new THREE.Box3().setFromObject(a), sz=b.getSize(new THREE.Vector3());
      a.rotation.y=((sz.x<sz.z)?Math.PI/2:0)+Math.PI;   // السمك الرفيع على محور z + عكس الاتجاه 180°
      scene.updateMatrixWorld(true);
      b.setFromObject(a); sz=b.getSize(new THREE.Vector3());
      a.scale.multiplyScalar(ART_SIZE/Math.max(sz.x,sz.y,1e-4));
      scene.updateMatrixWorld(true);
      onLivingAC(function(ac){
        scene.add(a);
        scene.updateMatrixWorld(true);
        b.setFromObject(a);
        var c=b.getCenter(new THREE.Vector3());
        a.position.x+=ac.x-c.x;
        a.position.y+=(ac.bottom-GAP_UNDER_AC-b.max.y);   // أعلى اللوحة تحت أسفل المكيف بـ 12 سم
        a.position.z+=(WALL_FACE_Z+0.004)-b.min.z;
        scene.updateMatrixWorld(true);
        bakeLighting();
      });
    },undefined,function(err){ console.warn('تعذر تحميل لوحة الحائط',err); });
  },'اللوحة');
}
addWallArt();

/* ========== لوحة غرفة 2 (نفس لوحة الصالة): على الحيطة الشرقية قدام الباب — ألوانها الداخلية متغيّرة والفريم أبيض ========== */
/* ---- أدوات تلوين بباليت متناسق ---- */
function _srgbFix(c){ if(renderer && renderer.outputEncoding===THREE.sRGBEncoding) c.convertSRGBToLinear(); return c; }
function _gradAt(cols,t){ t=Math.max(0,Math.min(1,t)); var n=cols.length-1, f=t*n, i=Math.min(n-1,Math.floor(f)); return cols[i].clone().lerp(cols[i+1],f-i); }
function gradientMapTexture(tex,hexes){          // بيحوّل سطوع الصورة لتدرّج بين ألوان الباليت (النقشة تفضل زي ما هي)
  try{
    var im=tex.image; if(!im) return tex;
    var w=im.naturalWidth||im.width, h=im.naturalHeight||im.height; if(!w||!h) return tex;
    var cols=hexes.map(function(x){ return new THREE.Color(x); }), lr=new Uint8Array(256), lg=new Uint8Array(256), lb=new Uint8Array(256);
    for(var k=0;k<256;k++){ var c=_gradAt(cols,k/255); lr[k]=Math.round(c.r*255); lg[k]=Math.round(c.g*255); lb[k]=Math.round(c.b*255); }
    var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    var cx=cv.getContext('2d'); cx.drawImage(im,0,0);
    var id=cx.getImageData(0,0,w,h), d=id.data;
    for(var i=0;i<d.length;i+=4){ var l=(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2])|0; d[i]=lr[l]; d[i+1]=lg[l]; d[i+2]=lb[l]; }
    cx.putImageData(id,0,0);
    var nt=new THREE.CanvasTexture(cv);
    nt.flipY=tex.flipY; nt.wrapS=tex.wrapS; nt.wrapT=tex.wrapT; nt.anisotropy=tex.anisotropy;
    if(tex.encoding!==undefined) nt.encoding=tex.encoding;
    nt.repeat.copy(tex.repeat); nt.offset.copy(tex.offset);
    return nt;
  }catch(e){ return tex; }
}
var ROOM_ART_PALETTE=[0x2a4d5a,0xc98b62,0x8fa393,0xd9c3a3,0xf3ebde];   // أزرق-أخضر غامق / تيراكوتا / أخضر رمادي / رملي / كريمي — متناسقين مع الخشب والحيطان
var ROOM_ART_STOPS=[0x2a4d5a,0xc98b62,0xf3ebde];
function recolorWallArt(root){
  var frameRe=/frame|border|edge|trim|mould|molding|stand/i, mats=[], seen=[];
  scene.updateMatrixWorld(true);
  var rb=new THREE.Box3().setFromObject(root), rs=rb.getSize(new THREE.Vector3());
  var dims=[rs.x,rs.y,rs.z], small=dims.indexOf(Math.min.apply(null,dims));       // أرفع محور = سمك اللوحة
  root.traverse(function(o){
    if(!o.isMesh||!o.material) return;
    var mb=new THREE.Box3().setFromObject(o), ms=mb.getSize(new THREE.Vector3()), md=[ms.x,ms.y,ms.z];
    var spans=true; for(var k=0;k<3;k++){ if(k!==small && md[k]<dims[k]*0.95) spans=false; }   // الميش اللي ماسك كل عرض وطول اللوحة
    (Array.isArray(o.material)?o.material:[o.material]).forEach(function(m){
      var i=seen.indexOf(m); if(i<0){ seen.push(m); mats.push({m:m,named:false,spans:false}); i=mats.length-1; }
      if(frameRe.test(o.name||'')||frameRe.test(m.name||'')) mats[i].named=true;
      if(spans) mats[i].spans=true;
    });
  });
  var art=[];
  mats.forEach(function(e){
    var isFrame=e.named;
    if(!isFrame && e.spans && !e.m.map && e.m.color){                 // خامة ماسكة اللوحة كلها + رمادي/أسود/بني = فريم
      var hs={}; e.m.color.getHSL(hs);
      if(hs.s<0.2 || (hs.h>0.04&&hs.h<0.13&&hs.l<0.5)) isFrame=true;
    }
    e.frame=isFrame; if(!isFrame) art.push(e);
  });
  if(!art.length){ art=mats.slice(); mats.forEach(function(e){ e.frame=false; }); }
  var flat=art.filter(function(e){ return !e.m.map && e.m.color; });
  flat.forEach(function(e){ var c=e.m.color; e.lum=0.299*c.r+0.587*c.g+0.114*c.b; });
  flat.sort(function(a,b){ return a.lum-b.lum; });
  mats.forEach(function(e){
    var m=e.m;
    if(e.frame){                                                       // الفريم أبيض
      m.map=null; m.metalnessMap=null; m.roughnessMap=null;
      if(m.color) m.color.setHex(0xffffff);
      m.metalness=0; m.roughness=0.5;
    }else if(m.map){
      m.map=gradientMapTexture(m.map,ROOM_ART_STOPS);
      if(m.color) m.color.setHex(0xffffff);
    }else if(m.color){
      var n=flat.length, ix=flat.indexOf(e);
      var pi=(n<=1)?1:Math.round(ix*(ROOM_ART_PALETTE.length-1)/(n-1));
      m.color.setHex(ROOM_ART_PALETTE[pi]); _srgbFix(m.color);
    }
    m.needsUpdate=true;
  });
}
function addRoomWallArt(){
  withGLTFLoader(function(loader){
    loader.load(WALL_ART_GLB_URL,function(gltf){
      var a=gltf.scene;
      prepareFurnitureModel(a);
      recolorWallArt(a);
      var ART_SIZE=0.9, EAST_FACE_X=17.38, ART_Z=3.55, ART_Y=1.65;
      a.rotation.y=0; scene.updateMatrixWorld(true);
      var b=new THREE.Box3().setFromObject(a), sz=b.getSize(new THREE.Vector3());
      a.rotation.y=((sz.x<sz.z)?Math.PI/2:0)+Math.PI-Math.PI/2;   // نفس اتجاه لوحة الصالة (وشها +z) ثم لفة -90° عشان وشها يبقى ناحية الباب (-x)
      scene.updateMatrixWorld(true);
      b.setFromObject(a); sz=b.getSize(new THREE.Vector3());
      a.scale.multiplyScalar(ART_SIZE/Math.max(sz.y,sz.z,1e-4));
      scene.add(a); scene.updateMatrixWorld(true);
