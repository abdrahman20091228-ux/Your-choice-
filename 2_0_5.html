/* ========== أبواب الشقة الداخلية (Quaternius): مفتوحة بالكامل ومردودة ملزوقة تقريباً في الجدار، وتصادمها رفيع جداً ==========
   باب الشقة الرئيسي مقفول فمسيبه زي ما هو (الباب المغلق اللي فوق). كل باب ينحط جنب فتحته على وش الجدار (فاصل ~1سم). */
var INTERIOR_DOOR_GLB_URL='https://raw.githubusercontent.com/abdrahman20091228-ux/Your-choice-/6cd5425e8e96fd06238be19bf2e0f03d624b2288/Door%20by%20Quaternius%20-%20KGt4ztcKrM.glb';
/* W = محور امتداد الجدار ('x' أو 'z') ، n0 = إحداثي منتصف الجدار على المحور الآخر ، w0..w1 = الفتحة ،
   side = ناحية فتح الباب (+1/-1 على المحور العمودي على الجدار) ، fold = الباب يترد ناحية بداية ('lo') أو نهاية ('hi') الفتحة */
var INTERIOR_DOOR_SPECS=[
  {name:'غرفة1', W:'z', n0:7.744,  w0:3.15,  w1:4.04,  half:0.06, side:-1, fold:'lo', deg:140, mirror:true },
  {name:'غرفة2', W:'z', n0:10.984, w0:3.15,  w1:4.04,  half:0.06, side:+1, fold:'lo', deg:150, mirror:false},  // الغرفة المشتركة مع جدار الصالة — عكسنا اتجاه المقبض
  {name:'حمام',  W:'x', n0:3.06,   w0:8.632, w1:9.592, half:0.06, side:-1, fold:'hi', deg:165, mirror:true },  // رجّعناه زي ما كان: بيفتح لجوّه ومفصلته ناحية اليمين
  {name:'مطبخ',  W:'x', n0:6.56,   w0:5.6,   w1:6.6,   half:0.06, side:-1, fold:'lo', deg:170, mirror:false}   // عكسنا اتجاه المقبض
];
var DOOR_OPEN_DEG=130;   // زاوية فتح الضلفة (كانت 180° ملزوقة في الحيطة)

/* الباب أبيض — بيسيب أجزاء المعدن (المقبض/القفل/المفصلات) بلونها لو الموديل مسميها */
function paintDoorWhite(root){
  var keep=/handle|knob|lever|lock|latch|hinge|metal|steel|chrome|brass|silver|gold|key/i;
  root.traverse(function(o){
    if(!o.isMesh || !o.material) return;
    var mats=Array.isArray(o.material)?o.material:[o.material];
    mats.forEach(function(m){
      if(m.transparent && m.opacity<0.95) return;
      if(keep.test(o.name||'') || keep.test(m.name||'')) return;
      m.map=null; m.metalnessMap=null; m.roughnessMap=null;
      if(m.color) m.color.setHex(0xffffff);
      m.metalness=0; m.roughness=0.55;
      m.needsUpdate=true;
    });
  });
}

function buildOpenDoor(src,spec){
  var d=src.clone(true);
  var drop=[];
  d.traverse(function(o){ if(o.isMesh && /frame|jamb|casing|trim/i.test(o.name||'')) drop.push(o); }); // الإطار يتشال (الفتحات أصلاً بدون إطار)
  drop.forEach(function(o){ if(o.parent) o.parent.remove(o); });
  d.traverse(function(o){ if(o.isMesh && o.geometry) o.geometry=o.geometry.clone(); }); // كل باب له هندسة مستقلة عشان الإضاءة المخبوزة ما تتشاركش
  prepareFurnitureModel(d);
  paintDoorWhite(d);
  scene.add(d);
  d.rotation.set(0,0,0); d.scale.set(1,1,1); d.position.set(0,0,0);
  scene.updateMatrixWorld(true);
  var b=new THREE.Box3().setFromObject(d), n=b.getSize(new THREE.Vector3());
  var wOnX=(n.x>=n.z), nW=wOnX?n.x:n.z, nT=wOnX?n.z:n.x;
  var leafW=(spec.w1-spec.w0)-0.04, leafH=2.03;
  var sw=leafW/Math.max(nW,1e-4), sy=leafH/Math.max(n.y,1e-4), st=Math.min(sw,sy);
  if(nT*st>0.06) st=0.06/Math.max(nT,1e-4);                       // سمك الضلفة رفيع
  /* اختيار الدوران: العرض على امتداد الجدار، ووش الباب ناحية الفتح */
  var nrm=(spec.W==='x')?[0,spec.side]:[spec.side,0], best=0, bestScore=-9;
  [0,Math.PI/2,Math.PI,-Math.PI/2].forEach(function(r){
    var wd=wOnX?[Math.cos(r),-Math.sin(r)]:[Math.sin(r),Math.cos(r)];   // اتجاه محور العرض بعد الدوران (x,z)
    var ok=(spec.W==='x')?Math.abs(wd[0])>0.9:Math.abs(wd[1])>0.9;
    if(!ok) return;
    var td=wOnX?[Math.sin(r),Math.cos(r)]:[Math.cos(r),-Math.sin(r)];   // اتجاه محور السمك الموجب
    var sc=td[0]*nrm[0]+td[1]*nrm[1];
    if(sc>bestScore){ bestScore=sc; best=r; }
  });
  d.rotation.y=best;
  /* عكس الضلفة (مرآة على محور العرض): المقبض كان في الطرف الغلط — كده بقى في الطرف البعيد عن المفصلات والمفصلات عند حرف الفتحة */
  var mir=spec.mirror?-1:1;
  if(wOnX) d.scale.set(mir*sw,sy,st); else d.scale.set(st,sy,mir*sw);
  scene.updateMatrixWorld(true);
  b.setFromObject(d);
  var sz=b.getSize(new THREE.Vector3()), thick=(spec.W==='x')?sz.z:sz.x;
  var isX=(spec.W==='x');

  /* 1) نحط الضلفة "مقفولة" جوّه الفتحة، ومفصلاتها عند حرف الفتحة (ناحية fold) */
  var cDir=(spec.fold==='lo')?1:-1;                                 // اتجاه الضلفة من المفصلة ناحية الفتحة (على محور الجدار)
  var hingeW=(spec.fold==='lo')?(spec.w0+0.02):(spec.w1-0.02);
  var nPiv=spec.n0+spec.side*(thick/2+0.004);
  var Wc=hingeW+cDir*leafW/2;
  var tx=isX?Wc:nPiv, tz=isX?nPiv:Wc, c=b.getCenter(new THREE.Vector3());
  d.position.x+=tx-c.x; d.position.z+=tz-c.z; d.position.y+=0.01-b.min.y;

  /* 2) نفتحها DOOR_OPEN_DEG درجة حوالين المفصلة ناحية جهة الفتح */
  var Px=isX?hingeW:nPiv, Pz=isX?nPiv:hingeW;
  var cx=isX?cDir:0, cz=isX?0:cDir, nx=isX?0:spec.side, nz=isX?spec.side:0;
  var ang=(spec.deg||DOOR_OPEN_DEG)*Math.PI/180;
  function rotDir(phi){ return [cx*Math.cos(phi)+cz*Math.sin(phi), -cx*Math.sin(phi)+cz*Math.cos(phi)]; }
  var phi=ang, rd=rotDir(phi);
  if(rd[0]*nx+rd[1]*nz<0){ phi=-ang; rd=rotDir(phi); }               // نتأكد إنها بتتفتح ناحية جهة الفتح مش ناحية الحيطة
  var dx=d.position.x-Px, dz=d.position.z-Pz;
  d.position.x=Px+dx*Math.cos(phi)+dz*Math.sin(phi);
  d.position.z=Pz-dx*Math.sin(phi)+dz*Math.cos(phi);
  d.rotation.y+=phi;
  scene.updateMatrixWorld(true);

  /* 3) تصادم: مربعات صغيرة على طول الضلفة المفتوحة (مش مستطيل كبير) — فتحة الباب نفسها تفضل فاضية */
  for(var k=0;k<5;k++){
    var s=(k+0.5)/5*leafW, qx=Px+rd[0]*s, qz=Pz+rd[1]*s;
    pushRect(qx-0.09,qz-0.09,qx+0.09,qz+0.09,leafH,false,0);
  }
}

/* ========== مكتب الغرفة 2 على الحائط ========== */
function addRoomDesk(){
  function afterLoaderReady(){
    var loader=new THREE.GLTFLoader();
    loader.load(DESK_GLB_URL,function(gltf){
      var desk=gltf.scene;
      prepareFurnitureModel(desk);
      scene.add(desk);

      /* الغرفة 2 هي الغرفة الأقرب للصالة. نضع المكتب ملاصقًا للحائط الشمالي
         بعيدًا عن الشباك الشرقي، وبطول أفقي واضح على الحائط. */
      var DESK_X=14.25, DESK_WALL_Z=0.23, DESK_TARGET_WIDTH=1.90*0.65; // 65% من الحجم الحالي

      var bestRot=0, bestScore=-Infinity;
      [0,Math.PI/2,Math.PI,-Math.PI/2].forEach(function(rot){
        desk.rotation.y=rot;
        scene.updateMatrixWorld(true);
        var bx=new THREE.Box3().setFromObject(desk);
        var sz=bx.getSize(new THREE.Vector3());
        if(sz.x>0.0001 && sz.z>0.0001){
          var score=(sz.x/sz.z) + (sz.x>=sz.z ? 10 : 0);
          if(score>bestScore){ bestScore=score; bestRot=rot; }
        }
      });

      desk.rotation.y=bestRot+Math.PI; // عكس الديسك 180° مع الحفاظ على وضعه ملاصقًا للجدار
      scene.updateMatrixWorld(true);
      var box=new THREE.Box3().setFromObject(desk);
      var size=box.getSize(new THREE.Vector3());
      var scale=DESK_TARGET_WIDTH/Math.max(size.x,0.0001);
      desk.scale.multiplyScalar(scale);
      scene.updateMatrixWorld(true);
      box.setFromObject(desk);

      /* تثبيت منتصفه أفقيًا على الحائط، والحافة الخلفية تلامس وش الحائط تقريبًا. */
      var center=box.getCenter(new THREE.Vector3());
      desk.position.x += DESK_X-center.x;
      desk.position.z += DESK_WALL_Z-box.min.z;
      desk.position.y += 0.01-box.min.y;

      scene.updateMatrixWorld(true);
      box.setFromObject(desk);
      pushRect(
        box.min.x+0.10,box.min.z+0.03,
        box.max.x-0.10,box.max.z-0.10,
        box.max.y
      );

      scene.updateMatrixWorld(true);
      bakeLighting();
    },undefined,function(err){
      console.warn('تعذر تحميل موديل المكتب',err);
    });
  }

  if(window.THREE && THREE.GLTFLoader){
    afterLoaderReady();
  }else{
    var s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js';
    s.onload=afterLoaderReady;
    s.onerror=function(){ console.warn('تعذر تحميل GLTFLoader للمكتب'); };
    document.head.appendChild(s);
  }
}

/* ========== نوافذ الصالة وغرفة 2 بستايل ليلي كحلي داكن ========== */
var WINDOW_GLB_URL='https://raw.githubusercontent.com/abdrahman20091228-ux/Your-choice-/b788144da31fe50e2743c4a48b1c5f82bdf5eb4f/window%20by%20Jonathan%20Granskog%20-%209FqbXmzB-CS.glb';

function addWindows(){
  function afterLoaderReady(){
    var loader=new THREE.GLTFLoader();
    loader.load(WINDOW_GLB_URL, function(gltf){
      var source=gltf.scene;

      function setupWindow(win, isSalon, posX, posZ, posY){
        win.traverse(function(child){
          if(child.isMesh){
            child.frustumCulled = true;

            // استنساخ الخامات لضمان استقلال كل شباك
            if(Array.isArray(child.material)){
              child.material = child.material.map(function(m){ return m.clone(); });
            } else if(child.material){
              child.material = child.material.clone();
            }

            var mats = Array.isArray(child.material) ? child.material : [child.material];
            mats.forEach(function(mat){
              var name = (mat.name || child.name || '').toLowerCase();

              // 1. استهداف الزجاج بدقة
              var isGlass = name.includes('glass') || name.includes('pane') || name.includes('window');
              if(!isGlass && mat.color){
                var hsl = {}; mat.color.getHSL(hsl);
                if(hsl.s < 0.28 && hsl.l > 0.20 && hsl.l < 0.85) isGlass = true;
              }

              // 2. استهداف الستارة بدقة (كشف ألوان الأصفر والبرتقالي والخامات)
              var isCurtain = name.includes('curtain') || name.includes('drape') || name.includes('fabric');
              if(!isCurtain && mat.color){
                if(mat.color.r > 0.45 && mat.color.g > 0.30 && mat.color.b < 0.40) isCurtain = true;
                var hsl2 = {}; mat.color.getHSL(hsl2);
                if(hsl2.h > 0.05 && hsl2.h < 0.22 && hsl2.s > 0.25) isCurtain = true;
              }

              if(isGlass){
                // كحلي ليلي غامق جداً (سماء ليل عميقة وواقعية)
                mat.map = null;
                mat.color.setHex(0x020612); // كحلي فاحم وظلام ليلي
                mat.roughness = 0.1;
                mat.metalness = 0.2;
                mat.emissive = new THREE.Color(0x000104);
                mat.vertexColors = false; // منع لمبات الغرفة من تبييض الزجاج ليفضل مظلم
                mat.needsUpdate = true;
              } else if(isCurtain){
                // إزالة أي ألوان صفراء قديمة من الشباكين
                mat.map = null;
                mat.roughness = 0.9;
                mat.metalness = 0.0;
                mat.needsUpdate = true;

                // تصفير ألوان الرؤوس المدمجة في المجسم لتظهر بيضاء نقية
                if(child.geometry && child.geometry.attributes.color){
                  var count = child.geometry.attributes.position.count;
                  var whites = new Float32Array(count * 3);
                  whites.fill(1.0);
                  child.geometry.setAttribute('color', new THREE.BufferAttribute(whites, 3));
                }

                if(isSalon){
                  // الصالة: أبيض مصفر كريمي دافئ (Ivory Cream)
                  mat.color.setHex(0xf6f1e6); mat.emissive=new THREE.Color(0x1c1a16);   // ستارة الصالة: أغمق من قبل وأفتح شوية من ستارة الغرفة
                } else {
                  // الغرفة: أبيض ناصع هادئ وأقل كريمية (Neutral Soft White)
                  mat.color.setHex(0xf0f2f5);
                }

                mat.vertexColors = true;
                bakeMeshes.push(child);
              } else {
                // خشب الإطار والماسورة
                mat.vertexColors = true;
                bakeMeshes.push(child);
              }
            });
          }
        });

        // الزجاج في الخلف والستارة في اتجاه الغرفة
        win.rotation.y = Math.PI / 2;
        scene.updateMatrixWorld(true);

        var box = new THREE.Box3().setFromObject(win);
        var size = box.getSize(new THREE.Vector3());

        var WIN_TARGET_HEIGHT = 1.85;
        if(size.y > 0.0001){

/* ========== تصادم دائري ناعم مع انزلاق على الحوائط والأثاث ========== */
function resolveCircleCollider(c){
  // أقرب نقطة من مركز اللاعب إلى المستطيل؛ هذا يعطي زوايا دائرية
  // حقيقية بدل صندوق تصادم مربع يعلق اللاعب عند الزاوية.
  var qx=Math.max(c.x1,Math.min(px,c.x2));
  var qz=Math.max(c.z1,Math.min(pz,c.z2));
  var dx=px-qx, dz=pz-qz;
  var distSq=dx*dx+dz*dz;
  var nx=0,nz=0,penetration=0;

  if(distSq>1e-10){
    var dist=Math.sqrt(distSq);
    if(dist>=RADIUS) return false;
    nx=dx/dist; nz=dz/dist;
    penetration=RADIUS-dist;
  }else{
    // اللاعب داخل حدود المستطيل؛ نخرجه من أقرب وجه بأقل حركة ممكنة.
    var left=px-c.x1, right=c.x2-px, top=pz-c.z1, bottom=c.z2-pz;
    var nearest=Math.min(left,right,top,bottom);
    if(nearest===left){ nx=-1; nz=0; penetration=RADIUS+left; }
    else if(nearest===right){ nx=1; nz=0; penetration=RADIUS+right; }
    else if(nearest===top){ nx=0; nz=-1; penetration=RADIUS+top; }
    else{ nx=0; nz=1; penetration=RADIUS+bottom; }
  }

  px+=nx*penetration;
  pz+=nz*penetration;

  // إزالة المركبة التي تدفع اللاعب داخل الجسم، مع إبقاء المركبة الجانبية
  // حتى ينزلق اللاعب على الحائط بدل أن يتوقف فجأة.
  var into=vx*nx+vz*nz;
  if(into<0){
    vx-=into*nx;
    vz-=into*nz;
  }
  return true;
}
function collide(){
  // التكرار القليل يحل تداخل زاويتين متقاربتين بدون قفزات محسوسة.
  for(var it=0;it<3;it++){
    var hit=false;
    for(var i=0;i<colliders.length;i++){
      if(resolveCircleCollider(colliders[i])) hit=true;
    }
    if(!hit) break;
  }
  px=Math.max(0.2+RADIUS,Math.min(W-0.2-RADIUS,px));
  pz=Math.max(0.2+RADIUS,Math.min(D-0.2-RADIUS,pz));
}

   (على شاشة 120Hz كان 60 يطلع 40 و30 يطلع 24) */
var _rafPrev=0, _refreshDt=16.7, _nextT=0;
function loop(now){
  requestAnimationFrame(loop);
  if(_rafPrev){ var _d=now-_rafPrev; if(_d>2&&_d<40){ _refreshDt=(_d<_refreshDt)?_d:(_refreshDt*0.995+_d*0.005); } }   // تقدير زمن فريم الشاشة الحقيقي
  _rafPrev=now;
  if(fpsLimit>0){
    var _iv=1000/fpsLimit;
    if(now<_nextT-_refreshDt*0.5) return;
    _nextT=(now-_nextT>_iv)?now+_iv:_nextT+_iv;
  }
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  clockTick(now);   // عقارب ساعة الحائط
  tvScreenTick(now);   // موجات الشاشة + الساعة الرقمية
  // الكاميرا السينمائية الهادئة في شاشة البداية
  if(!started){
    menuCamYaw += dt * 0.14; 
    // نفس معادلات التنفس/التمايل المستخدمة داخل اللعبة → أول لقطة في اللعبة مطابقة تماماً للقائمة
    var _bv=1.0+Math.sin(now*0.0008)*0.35, _by=Math.sin(now*0.0012)*(0.014*_bv), _sw=Math.sin(now*0.0012)*0.006;
    camera.position.set(14.45+Math.cos(menuCamYaw)*_sw, SIT_EYE+_by, SIT_Z-Math.sin(menuCamYaw)*_sw);   // اللاعب جالس على الأريكة
    camera.rotation.y = menuCamYaw;
    camera.rotation.x = -0.04;
    camera.rotation.z = Math.sin(now*0.0012)*0.003;
    renderer.render(scene, camera);
    return;
  }

  introUpdate(now);
  if(intro.active){ introTick(dt,now); renderer.render(scene,camera); return; }   // تسلسل النوم فقط

  // فحص الاقتراب من الكنبة (أمام الكنبة بمسافة 1.3 متر)
  nearSofa = Math.hypot(px - 14.45, pz - 7.6) < 1.35;

    var wantRight = (keys.KeyD || keys.ArrowRight || tv.s > 0.45);
    // رصد حركة اليد لليسار (A أو السهم اليسار أو الجويستيك يسار)

    if(shiftCooldown <= 0 && shiftProgress >= 0.95){
      if(wantRight && sitSlot < 2){ // أقصى حد خيارين يمين
        sitSlot++;

        targetSitX = 14.45 + sitSlot * 0.38; // 38 سم لكل نقلة
        shiftProgress = 0;
        shiftCooldown = 0.75;
      } else if(wantLeft && sitSlot > -2){ // أقصى حد خيارين يسار
        sitSlot--;
        shiftStartSitX = curSitX;
        targetSitX = 14.45 + sitSlot * 0.38;
        shiftProgress = 0;
        shiftCooldown = 0.75;
      }

var walkBob = Math.sin(bob) * 0.025 * Math.min(sp / 2.4, 1);

  var breathY = Math.sin(now * 0.0012) * (0.014 * breathVariation);

  var swaySide = Math.sin(now * 0.0012) * 0.006;

  var bobY = walkBob + breathY;

  var scootArcY = 0;

    // بطأنا الحركة لتستغرق حوالي ثلثين ثانية بوقار
    shiftProgress = Math.min(1.0, shiftProgress + dt * 1.35);

    // 1. ديلاي البداية: أول 22% من الوقت مفيش أي زحلقة أفقية (الجسم بيترفع لفوق في مكانه فقط)
    var horizT = Math.max(0, Math.min(1, (shiftProgress - 0.22) / 0.68));

    curSitX = THREE.MathUtils.lerp(shiftStartSitX, targetSitX, smoothShift);

    // 2. ارتفاع طبيعي وواضح (7.5 سم) صعوداً ثم هبوطاً على الشلتة الجديدة
    scootArcY = Math.sin(shiftProgress * Math.PI) * 0.075;
  }

  var curCamX = THREE.MathUtils.lerp(px, curSitX, easeSit);

    var maxEffortYaw = 2.65; // أقصى مدى تقدر تشده بالمجهود بعد الـ 2.40

    // مقاومة تدريجية في اليمين (كل ما تقرب من 2.40 الثقل يزيد)
    if(yaw > comfortYaw){
      var tension = (yaw - comfortYaw);
      var pullSpeed = (lookId !== null ? 3.5 : 8.5) * (1.0 + tension * 1.8);
      yaw = THREE.MathUtils.lerp(yaw, comfortYaw, dt * pullSpeed);
      if(yaw > maxEffortYaw) yaw = maxEffortYaw;

      var tension = (-yaw - comfortYaw);
      var pullSpeed = (lookId !== null ? 3.5 : 8.5) * (1.0 + tension * 1.8);
      yaw = THREE.MathUtils.lerp(yaw, -comfortYaw, dt * pullSpeed);
      if(yaw < -maxEffortYaw) yaw = -maxEffortYaw;
    }

    // لأسفل: توقف هادئ ومستقر عند -1.0 (ذقنك على صدرك بدون زنبرك)
    pitch = Math.max(-1.0, Math.min(1.3, pitch));
  }
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;
  camera.rotation.z = Math.sin(now * 0.0012) * 0.003;
  camera.rotation.y=yaw; camera.rotation.x=pitch;
  nearDoor = Math.hypot(px - 0.6, pz - 8.05) < 1.5;
  nearBed=false;
  if(bedInfo && !isSitting && !slept){ var _bb=bedInfo.box, _dx=Math.max(_bb.min.x-px,0,px-_bb.max.x), _dz=Math.max(_bb.min.z-pz,0,pz-_bb.max.z); nearBed=Math.hypot(_dx,_dz)<0.85; }

    if(isTouch) ub.style.display='block';
    else hintEl.textContent = 'اضغط E للوقوف';
  } else if(nearSofa){
    if(isTouch) ub.style.display='block';

  } else if(nearBed){
    if(isTouch){ ub.style.display='block'; setUseIcon('bedtime'); }
    else hintEl.textContent = 'اضغط E للنوم';
  } else if(nearTV){
    if(isTouch){ ub.style.display='block'; setUseIcon('power_settings_new'); }
    else hintEl.textContent = tvOn ? 'اضغط E لإطفاء التلفاز' : 'اضغط E لتشغيل التلفاز';

  } else {
    ub.style.display = 'none';
    hintEl.textContent = '';
  }
  hintEl.classList.toggle('hidden', !showAction || isTouch);
  if(showFPS||showCoords){
    fpsAcc+=dt; fpsCnt++;

var eyeTopEl=document.getElementById('eyeTop'), eyeBotEl=document.getElementById('eyeBot');
var LID_KEYS=[[0,0],[0.18,0.26],[0.32,0.17],[0.5,0.42],[0.62,0.36],[0.85,0.85],[1,1.06]];
function lidOpen(p){
  p=Math.max(0,Math.min(1,p));
  for(var i=1;i<LID_KEYS.length;i++){
    if(p<=LID_KEYS[i][0]){ var a=LID_KEYS[i-1], b=LID_KEYS[i], k=smooth01((p-a[0])/(b[0]-a[0])); return a[1]+(b[1]-a[1])*k; }

var INTRO_OPEN_MS=3200, INTRO_CEIL_PITCH=0.5, INTRO_GETUP_AT=8000, INTRO_GETUP_MS=1500;
function introTick(dt,now){
  var breath=Math.sin(now*0.0012)*0.014, ph=intro.phase, eyeY=EYE, L=THREE.MathUtils.lerp, P=intro.pose;

    }

    yaw=-Math.PI/2; pitch=INTRO_CEIL_PITCH; eyeY=P.ly;
    camera.position.set(P.lx,eyeY,P.lz);

/* JPG ما فيهوش شفافية → نشيل السواد المتصل بحواف الصورة (الزوايا والإطار) ونخليه شفاف */
function cutBlackEdges(im){
  var w=im.naturalWidth, h=im.naturalHeight, T=40, H=100;
  var c=document.createElement('canvas'); c.width=w; c.height=h;
  var ctx=c.getContext('2d'); ctx.drawImage(im,0,0);
  var id=ctx.getImageData(0,0,w,h), d=id.data, seen=new Uint8Array(w*h), st=[];
  function dark(i){ var k=i*4; return d[k]<T && d[k+1]<T && d[k+2]<T; }
  function seed(i){ if(!seen[i] && dark(i)){ seen[i]=1; st.push(i); } }
  var x,y;
  for(x=0;x<w;x++){ seed(x); seed((h-1)*w+x); }
  for(y=0;y<h;y++){ seed(y*w); seed(y*w+w-1); }
  while(st.length){
    var i=st.pop(); x=i%w; y=(i/w)|0;
    if(x>0) seed(i-1); if(x<w-1) seed(i+1); if(y>0) seed(i-w); if(y<h-1) seed(i+w);
  }
  for(var n=0;n<w*h;n++) if(seen[n]) d[n*4+3]=0;
  for(y=0;y<h;y++) for(x=0;x<w;x++){           // تنعيم الحافة بمقدار بيكسل
    var q=y*w+x; if(seen[q]) continue;
    if(!((x>0&&seen[q-1])||(x<w-1&&seen[q+1])||(y>0&&seen[q-w])||(y<h-1&&seen[q+w]))) continue;
    var m=Math.max(d[q*4],d[q*4+1],d[q*4+2]);
    if(m<H) d[q*4+3]=Math.round(255*Math.max(0,(m-T)/(H-T)));
  }
  ctx.putImageData(id,0,0);
  return c.toDataURL('image/png');
}
function loadCallImg(imgEl,url){
  var im=new Image(); im.crossOrigin='anonymous';
  im.onload=function(){ try{ imgEl.src=cutBlackEdges(im); }catch(e){ imgEl.src=url; } };
  im.onerror=function(){ imgEl.src=url; };
  im.src=url;
}
loadCallImg(callImgIn,CALL_IMG_IN); loadCallImg(callImgOn,CALL_IMG_ON);

  return vibeCtx;
}
['touchend','pointerup','click','keydown'].forEach(function(ev){ addEventListener(ev, getVibeCtx, {passive:true}); }); // فتح الصوت من أول لمسة
/* محرّك الاهتزاز (مأخوذ من صفحة "طنين"): أساس 178Hz + توافقيات + عمق 89Hz + خشخشة + دقّة لمس، غلاف تسارع/تباطؤ، وسلسلة lowpass + ضاغط.
   النمط: نبضة 700ms → سكون 250ms → نبضة 700ms → سكون 900ms → تكرار (لحد ما المكالمة تترد) */
var VIBE_PATTERN=[{on:0.70,off:0.25},{on:0.70,off:0.90}];
function vibePitchEnv(param,start,dur,base){
  param.setValueAtTime(base*0.82,start);
  param.exponentialRampToValueAtTime(base,start+0.09);
  param.setValueAtTime(base,start+dur-0.18);
  param.exponentialRampToValueAtTime(base*0.62,start+dur);
}
function vibeSchedulePulse(E,start,dur){
  var ctx=E.ctx, g=ctx.createGain(); g.connect(E.master);
  g.gain.setValueAtTime(0.0001,start);
  g.gain.linearRampToValueAtTime(0.85,start+0.07);
  g.gain.setValueAtTime(0.85,start+dur-0.16);
  g.gain.exponentialRampToValueAtTime(0.0008,start+dur);
  var sources=[];
  var lfo=ctx.createOscillator(); lfo.frequency.value=27;
  var lfoG=ctx.createGain(); lfoG.gain.value=0.05;
  lfo.connect(lfoG); lfoG.connect(g.gain); lfo.start(start); lfo.stop(start+dur+0.05); sources.push(lfo);
  [{ratio:1,type:'sine',amp:0.78},{ratio:2,type:'sine',amp:0.24},{ratio:3.03,type:'triangle',amp:0.07},{ratio:0.5,type:'sine',amp:0.24}].forEach(function(L){
    var o=ctx.createOscillator(); o.type=L.type; vibePitchEnv(o.frequency,start,dur,178*L.ratio);
    var og=ctx.createGain(); og.gain.value=L.amp; o.connect(og); og.connect(g);
    o.start(start); o.stop(start+dur+0.05); sources.push(o);
  });
  var nz=ctx.createBufferSource(); nz.buffer=E.noiseBuf; nz.loop=true;
  var bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1500; bp.Q.value=1.1;
  var ng=ctx.createGain(); ng.gain.value=0.035; nz.connect(bp); bp.connect(ng); ng.connect(g);
  nz.start(start); nz.stop(start+dur+0.05); sources.push(nz);
  var nz2=ctx.createBufferSource(); nz2.buffer=E.noiseBuf; nz2.loop=true;
  var lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=240;
  var ng2=ctx.createGain(); ng2.gain.value=0.08; nz2.connect(lp); lp.connect(ng2); ng2.connect(g);
  nz2.start(start); nz2.stop(start+dur+0.05); sources.push(nz2);
  var th=ctx.createOscillator(); th.type='sine';
  th.frequency.setValueAtTime(72,start); th.frequency.exponentialRampToValueAtTime(48,start+0.1);
  var thG=ctx.createGain(); thG.gain.setValueAtTime(0.0001,start);
  thG.gain.linearRampToValueAtTime(0.22,start+0.006); thG.gain.exponentialRampToValueAtTime(0.0008,start+0.11);
  th.connect(thG); thG.connect(E.master); th.start(start); th.stop(start+0.15); sources.push(th);
  var pulse={g:g,sources:sources}; E.pulses.push(pulse);
  setTimeout(function(){ var k=E.pulses.indexOf(pulse); if(k>-1) E.pulses.splice(k,1); },(start-ctx.currentTime+dur+0.2)*1000);
}
function stopVibeSound(){
  if(!vibeEng) return;
  var E=vibeEng; vibeEng=null; clearTimeout(E.timer);
  try{
    var now=E.ctx.currentTime;
    E.pulses.forEach(function(p){
      p.g.gain.cancelScheduledValues(now); p.g.gain.setTargetAtTime(0,now,0.035);   // تلاشٍ سريع وناعم — بلا نقرة
      p.sources.forEach(function(o){ try{ o.stop(now+0.2); }catch(e){} });
    });
    E.pulses=[];
    E.master.gain.setTargetAtTime(0,now,0.03);
    setTimeout(function(){ try{ E.master.disconnect(); }catch(e){} },500);
  }catch(e){}
}
function startVibeSound(rampSec){
  stopVibeSound();
  var ctx=getVibeCtx(); if(!ctx) return;
  try{
    var master=ctx.createGain(); master.gain.value=(rampSec>0?0.0001:0.7);
    if(rampSec>0){ master.gain.setValueAtTime(0.0001,ctx.currentTime); master.gain.linearRampToValueAtTime(0.7,ctx.currentTime+rampSec); }   // يزداد تدريجياً لين القمة
    var soft=ctx.createBiquadFilter(); soft.type='lowpass'; soft.frequency.value=4200; soft.Q.value=0.4;
    var comp=ctx.createDynamicsCompressor(); comp.threshold.value=-16; comp.knee.value=22; comp.ratio.value=3.5; comp.attack.value=0.006; comp.release.value=0.18;
    master.connect(soft); soft.connect(comp); comp.connect(ctx.destination);
    var nb=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate), nd=nb.getChannelData(0);
    for(var i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
    var E={ctx:ctx,master:master,noiseBuf:nb,timer:null,pulses:[]};
    vibeEng=E;
    (function cycle(){
      if(vibeEng!==E) return;
      var t=ctx.currentTime+0.06;
      VIBE_PATTERN.forEach(function(p){ vibeSchedulePulse(E,t,p.on); t+=p.on+p.off; });
      E.timer=setTimeout(cycle,(t-ctx.currentTime)*1000);
    })();
  }catch(e){ vibeEng=null; }
}

function showCall(){
  if(callActive) return;
  callActive = true; callAnswered = false;
  callImgIn.classList.remove('off'); callImgOn.classList.add('off');
  callBox.style.display = 'block';
  callBox.style.transition = 'none';
  callBox.style.transform = 'translateY(' + (dims.h + 60) + 'px)'; // تبدأ من تحت الشاشة
  void callBox.offsetHeight;
  callBox.style.transition = 'transform .8s cubic-bezier(.16,1,.3,1)';
  callBox.style.transform = 'translateY(0)';                       // تطلع لفوق يسار
}
function hideCall(){ stopVibeSound(); callActive = false; callBox.style.display = 'none'; }
function answerCall(){
  if(!callActive || callAnswered) return;
  callAnswered = true;
  stopVibeSound();                     // الاهتزاز يقف لحظة الرد
  callImgIn.classList.add('off');
  callImgOn.classList.remove('off');   // نفس المكان تماماً
}
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
